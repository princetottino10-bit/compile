<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>COMPILE - カードリスト</title>
  <!-- 3D アリーナの中で開いたとき (?embed=1) は、サイトの見出し (他ページへのリンク) を出さない -->
  <script>if (/[?&]embed=1(&|$)/.test(location.search)) document.documentElement.classList.add('embed');</script>
  <style>html.embed .cp-top { display: none; }</style>
  <meta name="description" content="ボードゲーム『コンパイル』全30プロトコル・180枚のカードリスト。効果の検索、逆引き、デッキ分析。">
  <meta name="theme-color" content="#03040a">
  <link rel="apple-touch-icon" href="icons/cardlist-180.png">
  <link rel="icon" href="icons/cardlist-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="COMPILE">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="companion.css?v=613064e92f">
  <script type="importmap">
  {
    "imports": {
      "./companion.js": "./companion.js?v=5e681c247a",
      "./js3d/emblems.js": "./js3d/emblems.js?v=6d1c077a2e",
      "./js3d/icons.js": "./js3d/icons.js?v=15bacde80c"
    }
  }
  </script>
  <style>
    /* ---------- タブ ---------- */
    .tabs {
      position: sticky;
      top: var(--top-h, 55px);
      z-index: 20;
      display: flex;
      gap: 4px;
      margin: 0 -16px;
      padding: 8px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      background: rgba(3, 4, 10, .86);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--edge);
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: none;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: none;
      cursor: pointer;
      font: 800 12px/1 system-ui, sans-serif;
      letter-spacing: .1em;
      color: var(--dim);
      transition: color .18s, border-color .18s, background .18s;
    }
    .tab:hover { color: var(--ink); }
    .tab[aria-selected="true"] { color: #fff; border-color: rgba(255, 59, 157, .55); background: rgba(255, 59, 157, .13); }
    .view { display: none; padding-top: 6px; }
    .view.on { display: block; animation: fade .25s ease both; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ---------- 絞り込み ---------- */
    .filters { display: flex; flex-direction: column; gap: 12px; margin: 16px 0 14px; }
    .search { position: relative; }
    .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--dim); pointer-events: none; }
    .search .cp-input { padding-left: 40px; }
    .frow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .frow > .flbl { width: 64px; flex: none; font: 800 10px/1 system-ui, sans-serif; letter-spacing: .16em; color: var(--dim); }
    .fx-chip { display: inline-flex; align-items: center; gap: 6px; }
    .fx-chip svg { flex: none; }
    details.pick-protos { border: 1px solid var(--edge); border-radius: 12px; background: rgba(8, 11, 21, .6); }
    details.pick-protos > summary {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      cursor: pointer;
      list-style: none;
      font: 800 11px/1 system-ui, sans-serif;
      letter-spacing: .12em;
      color: var(--dim);
    }
    details.pick-protos > summary::-webkit-details-marker { display: none; }
    details.pick-protos > summary::before { content: "▸"; color: var(--pink); transition: transform .18s; }
    details.pick-protos[open] > summary::before { transform: rotate(90deg); }
    details.pick-protos > summary .sel-names { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); letter-spacing: .06em; }
    .pp-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
    .pp-set { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .pp-set > button.lvl { min-width: 72px; }
    .result-bar { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; }
    .result-bar .n { font: 900 12px/1 system-ui, sans-serif; letter-spacing: .12em; color: var(--mint); }
    .result-bar .grow { flex: 1; }

    /* ---------- カード ---------- */
    .cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
    .card {
      --pc: var(--cyan);
      position: relative;
      display: flex;
      gap: 12px;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, .08);
      background: linear-gradient(180deg, rgba(13, 17, 32, .95), rgba(7, 10, 19, .95));
      text-align: left;
      cursor: pointer;
      transition: border-color .18s, transform .18s, box-shadow .18s;
    }
    .card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--pc);
      box-shadow: 0 0 12px var(--pc);
    }
    .card:hover { border-color: color-mix(in srgb, var(--pc) 60%, transparent); transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0, 0, 0, .45); }
    .c-art {
      position: relative;
      flex: none;
      width: 92px;
      aspect-ratio: 360 / 490;
      border-radius: 9px;
      overflow: hidden;
      background: #0a0f1c;
      border: 1px solid rgba(255, 255, 255, .08);
    }
    .c-art img.art { width: 100%; height: 100%; object-fit: cover; }
    .c-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(3, 4, 10, .55), transparent 40%, transparent 70%, rgba(3, 4, 10, .6)); }
    .c-val {
      position: absolute;
      left: 6px;
      top: 5px;
      z-index: 1;
      font: 900 26px/1 system-ui, sans-serif;
      color: #fff;
      text-shadow: 0 0 10px var(--pc), 0 2px 6px rgba(0, 0, 0, .9);
    }
    .c-emb { position: absolute; right: 5px; bottom: 5px; z-index: 1; width: 24px; height: 24px; }
    .c-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
    .c-head { display: flex; align-items: center; gap: 8px; }
    .c-name { font: 900 13px/1.1 system-ui, sans-serif; letter-spacing: .12em; color: color-mix(in srgb, var(--pc) 45%, #fff); }
    .c-set { font: 700 9px/1 system-ui, sans-serif; letter-spacing: .12em; color: var(--dimmer); }
    .c-fx { margin-left: auto; display: flex; gap: 4px; }
    .c-fx span {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .08);
    }
    .zones { display: flex; flex-direction: column; gap: 5px; }
    .z {
      display: flex;
      gap: 7px;
      margin: 0;
      font: 500 12.5px/1.6 system-ui, sans-serif;
      color: var(--ink);
    }
    .z > i { flex: none; width: 14px; text-align: center; font-size: 10px; line-height: 20px; font-style: normal; }
    .z > span { flex: 1; min-width: 0; }
    .z.upper > i { color: var(--z-up); }
    .z.middle > i { color: var(--z-mid); }
    .z.lower > i { color: var(--z-low); }
    .z b.cond { font-weight: 800; color: #fff; text-decoration: underline; text-decoration-color: rgba(255, 255, 255, .35); text-underline-offset: 3px; }
    .z mark { background: rgba(239, 208, 108, .28); color: #fff; border-radius: 3px; padding: 0 1px; }
    .z-none { display: block; font: 600 12px/1.6 system-ui, sans-serif; color: var(--dimmer); }

    /* リスト表示: 絵を小さく、1列で詰める */
    .cards.list { grid-template-columns: 1fr; gap: 6px; }
    .cards.list .card { padding: 8px 10px; gap: 10px; }
    .cards.list .c-art { width: 44px; }
    .cards.list .c-val { font-size: 17px; left: 4px; top: 3px; }
    .cards.list .c-emb { display: none; }
    .cards.list .c-main { gap: 4px; }
    .cards.list .z { font-size: 12px; line-height: 1.5; }

    /* ---------- プロトコル ---------- */
    .set-head { margin: 22px 0 10px; font: 800 11px/1 system-ui, sans-serif; letter-spacing: .2em; color: var(--dim); }
    .set-head b { color: var(--pink); }
    .protos-big .proto { height: 132px; }
    .proto-tags { font: 600 10.5px/1.4 system-ui, sans-serif; color: var(--dim); letter-spacing: .02em; }

    /* ---------- 逆引き ---------- */
    .mx-wrap { overflow: auto; border: 1px solid var(--edge); border-radius: 14px; background: rgba(8, 11, 21, .7); max-height: calc(100vh - 190px); }
    .mx { border-collapse: separate; border-spacing: 0; width: 100%; font: 800 13px/1 system-ui, sans-serif; }
    .mx th, .mx td { padding: 0; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, .05); }
    .mx thead th {
      position: sticky;
      top: 0;
      z-index: 3;
      height: 38px;
      background: #0b0f1d;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: .12em;
    }
    .mx thead th:first-child { left: 0; z-index: 4; text-align: left; padding-left: 12px; }
    .mx .rh {
      position: sticky;
      left: 0;
      z-index: 2;
      background: #090c18;
      text-align: left;
      padding: 0 12px 0 10px;
      white-space: nowrap;
      border-right: 1px solid var(--edge);
    }
    .mx .rh span { display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px; letter-spacing: .08em; color: color-mix(in srgb, var(--pc) 40%, #fff); }
    .mx .rh img { width: 22px; height: 22px; }
    .mx .grp td { position: sticky; left: 0; padding: 12px 12px 6px; text-align: left; background: #06080f; font-size: 10px; letter-spacing: .2em; color: var(--dim); }
    .mx .cell {
      width: 100%;
      min-width: 42px;
      height: 40px;
      border: 0;
      background: none;
      cursor: pointer;
      font: 900 15px/1 system-ui, sans-serif;
      color: color-mix(in srgb, var(--pc) 35%, #fff);
      transition: background .15s;
    }
    .mx .cell:hover { background: color-mix(in srgb, var(--pc) 25%, transparent); color: #fff; }
    .mx .nil { color: rgba(255, 255, 255, .12); }
    .mx tr:hover .rh { background: #0e1224; }

    /* ---------- デッキ分析 ---------- */
    .ana-pick { display: flex; flex-direction: column; gap: 10px; }
    .ana-count { font: 900 14px/1 system-ui, sans-serif; letter-spacing: .12em; color: var(--mint); }
    .ana-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); margin-top: 12px; }
    .ana-card h3 { margin: 0 0 12px; display: flex; align-items: center; gap: 8px; font: 900 12px/1 system-ui, sans-serif; letter-spacing: .14em; }
    .ana-card h3 img { width: 22px; height: 22px; }
    .bars { display: flex; flex-direction: column; gap: 6px; }
    .brow {
      display: grid;
      grid-template-columns: 96px 1fr 28px;
      align-items: center;
      gap: 10px;
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: none;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }
    .brow:hover { background: rgba(255, 255, 255, .04); }
    .brow.on { border-color: var(--gold); background: rgba(239, 208, 108, .1); }
    .blbl { display: inline-flex; align-items: center; gap: 6px; font: 700 12px/1 system-ui, sans-serif; }
    .btrk { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .05); overflow: hidden; }
    .bfill { height: 100%; border-radius: 99px; }
    .bval { font: 900 12px/1 system-ui, sans-serif; text-align: right; color: var(--dim); }
    .hist { display: flex; align-items: flex-end; gap: 8px; height: 110px; padding-top: 6px; }
    .hist div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
    .hist i { width: 100%; max-width: 34px; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--cyan), rgba(99, 243, 255, .25)); }
    .hist b { font: 900 11px/1 system-ui, sans-serif; color: var(--dim); }
    .hist small { font: 800 10px/1 system-ui, sans-serif; color: var(--ink); }
    .ana-sel { display: grid; gap: 8px; grid-template-columns: repeat(3, 1fr); }
    .ana-sel .proto { height: 84px; }

    /* ---------- カードの詳しい表示 ---------- */
    .dt { display: grid; grid-template-columns: 220px 1fr; gap: 22px; padding: 22px; }
    .dt-art { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 360 / 490; border: 1px solid var(--edge-2); background: #0a0f1c; box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 25%, transparent); }
    .dt-art img.art { width: 100%; height: 100%; object-fit: cover; }
    .dt-art .c-val { font-size: 46px; left: 12px; top: 10px; }
    .dt-art .c-emb { width: 40px; height: 40px; right: 10px; bottom: 10px; }
    .dt-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(3, 4, 10, .5), transparent 35%, transparent 75%, rgba(3, 4, 10, .6)); }
    .dt-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 4px 40px 4px 0; }
    .dt-title b { font: 900 24px/1 system-ui, sans-serif; letter-spacing: .14em; color: color-mix(in srgb, var(--accent) 40%, #fff); }
    .dt-title span { font: 800 11px/1 system-ui, sans-serif; letter-spacing: .14em; color: var(--dim); }
    .dt-tags { margin: 0 0 16px; font: 600 12px/1.6 system-ui, sans-serif; color: var(--dim); }
    .dz { border-radius: 12px; border: 1px solid var(--edge); overflow: hidden; margin-bottom: 8px; }
    .dz-h { padding: 8px 12px; font: 900 10.5px/1 system-ui, sans-serif; letter-spacing: .14em; }
    .dz.upper .dz-h { color: var(--z-up); background: rgba(255, 107, 107, .1); }
    .dz.middle .dz-h { color: var(--z-mid); background: rgba(99, 179, 255, .1); }
    .dz.lower .dz-h { color: var(--z-low); background: rgba(109, 255, 194, .08); }
    .dz-b { padding: 10px 12px 12px; font: 500 14px/1.75 system-ui, sans-serif; }
    .dz-b b.cond { font-weight: 800; color: #fff; text-decoration: underline; text-decoration-color: rgba(255, 255, 255, .35); text-underline-offset: 3px; }
    .dz.empty .dz-b { color: var(--dimmer); font-size: 12px; }
    .dt-fx { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
    .dt-fx span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--edge-2); font: 800 11px/1 system-ui, sans-serif; }
    .codex { margin-top: 14px; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(239, 208, 108, .35); background: rgba(239, 208, 108, .06); font: 500 12.5px/1.75 system-ui, sans-serif; }
    .codex b { display: block; margin-bottom: 4px; font: 900 10px/1 system-ui, sans-serif; letter-spacing: .2em; color: var(--gold); }
    .sib { grid-column: 1 / -1; }
    .sib-h { margin: 0 0 10px; font: 800 10.5px/1 system-ui, sans-serif; letter-spacing: .16em; color: var(--dim); }
    .sib-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .sib-row button { position: relative; padding: 0; border-radius: 9px; overflow: hidden; aspect-ratio: 360 / 490; cursor: pointer; border: 1px solid var(--edge); background: #0a0f1c; opacity: .55; transition: opacity .18s, border-color .18s; }
    .sib-row button img { width: 100%; height: 100%; object-fit: cover; }
    .sib-row button b { position: absolute; left: 6px; top: 4px; font: 900 16px/1 system-ui, sans-serif; color: #fff; text-shadow: 0 1px 6px #000; }
    .sib-row button:hover { opacity: .9; }
    .sib-row button[aria-current="true"] { opacity: 1; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

    /* プロトコルの詳しい表示 */
    .pv-hero { position: relative; height: 170px; background-size: cover; background-position: center 30%; }
    .pv-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7, 10, 20, .1), #070a14); }
    .pv-hero img { position: absolute; left: 22px; bottom: 16px; z-index: 1; width: 64px; height: 64px; }
    .pv-hero .t { position: absolute; left: 100px; bottom: 22px; z-index: 1; }
    .pv-hero .t b { display: block; font: 900 26px/1 system-ui, sans-serif; letter-spacing: .16em; }
    .pv-hero .t span { font: 800 11px/1 system-ui, sans-serif; letter-spacing: .14em; color: var(--dim); }
    .pv-body { padding: 4px 22px 22px; }
    .pv-list { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); margin-top: 12px; }
    .pv-list .card { padding: 8px; }
    .pv-list .c-art { width: 70px; }

    @media (max-width: 700px) {
      .tabs { margin: 0 -12px; padding: 8px 12px; }
      .tab { padding: 9px 13px; font-size: 11.5px; }
      .cards { grid-template-columns: 1fr; }
      .c-art { width: 78px; }
      .frow > .flbl { width: 100%; }
      .dt { grid-template-columns: 1fr; padding: 18px 16px; gap: 14px; }
      .dt-art { width: 150px; margin: 0 auto; }
      .sib-row { gap: 5px; }
      .pv-hero { height: 140px; }
      .pv-body { padding: 4px 16px 18px; }
      .pv-list { grid-template-columns: 1fr; }
      .ana-sel .proto { height: 64px; }
      .brow { grid-template-columns: 84px 1fr 24px; }
      .protos-big .proto { height: 104px; }
    }
  </style>
</head>
<body>
  <header class="cp-top">
    <a class="cp-brand" href="index.html">COMPILE <em>&lt;!&gt;</em></a>
    <nav class="cp-nav" aria-label="ツール">
      <a href="three-play.html">3D ARENA</a>
      <a href="cardlist.html" aria-current="page">CARD LIST</a>
      <a href="picker.html">PICKER</a>
      <a href="rules.html">RULES</a>
      <a href="control-tracker.html">CONTROL</a>
    </nav>
  </header>

  <main class="cp-wrap">
    <div class="cp-head">
      <h1 class="cp-h1"><b>//</b> CARD LIST</h1>
      <p class="cp-sub">全プロトコルのカード・逆引き・デッキ分析</p>
      <span class="cp-count" id="total"></span>
    </div>

    <div class="tabs" role="tablist" aria-label="表示">
      <button type="button" class="tab" role="tab" data-tab="list">カード</button>
      <button type="button" class="tab" role="tab" data-tab="proto">プロトコル</button>
      <button type="button" class="tab" role="tab" data-tab="lookup">逆引き</button>
      <button type="button" class="tab" role="tab" data-tab="ana">デッキ分析</button>
    </div>

    <!-- カード -->
    <section class="view" id="v-list" role="tabpanel">
      <div class="filters">
        <label class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input class="cp-input" id="q" type="search" placeholder="効果の文を検索（例: 反転、手札、削除）" autocomplete="off" aria-label="効果の文を検索">
        </label>
        <details class="pick-protos" id="ppBox">
          <summary>プロトコル <span class="sel-names" id="ppNames">すべて</span></summary>
          <div class="pp-body" id="ppBody"></div>
        </details>
        <div class="frow" id="fxRow"><span class="flbl">効果</span></div>
      </div>
      <div class="result-bar">
        <span class="n" id="hits"></span>
        <span class="grow"></span>
        <button type="button" class="lvl sm" id="reset">リセット</button>
        <span class="seg">
          <button type="button" class="lvl sm" data-view="tile">タイル</button>
          <button type="button" class="lvl sm" data-view="list">リスト</button>
        </span>
      </div>
      <div class="cards" id="grid"></div>
    </section>

    <!-- プロトコル -->
    <section class="view" id="v-proto" role="tabpanel"><div id="protoSets"></div></section>

    <!-- 逆引き -->
    <section class="view" id="v-lookup" role="tabpanel">
      <p class="cp-sub" style="margin:16px 0 12px">プロトコルと値から、カードを探します。数字を押すとそのカードを開きます。</p>
      <div class="mx-wrap"><table class="mx" id="mx"></table></div>
    </section>

    <!-- デッキ分析 -->
    <section class="view" id="v-ana" role="tabpanel">
      <div class="cp-label"><b>//</b> プロトコルを3つ選ぶ <span class="cp-label-side"><span class="ana-count" id="anaCount">0 / 3</span><button type="button" class="lvl sm" id="anaReset">リセット</button></span></div>
      <div class="ana-pick" id="anaPick"></div>
      <div id="anaOut"></div>
    </section>

    <p class="cp-foot">FAN-MADE COMPANION APP · NOT AFFILIATED WITH THE OFFICIAL GAME</p>
  </main>

  <script type="module">
    import {
      SETS, EFFECTS, EFFECT_LABEL, EFFECT_COLOR, ZONES, esc, cardText, loadProtocols,
      protoArt, cardArt, emblem, effectIcon, protoTile, protoChip, store, sheet
    } from './companion.js';

    const KEY = 'compile.cardlist.v2';
    const TABS = ['list', 'proto', 'lookup', 'ana'];
    const S = Object.assign({ tab: 'list', view: 'tile', fx: 'all', sel: [], q: '', ana: [], anaFx: null }, store.get(KEY, {}));
    S.q = '';
    const save = () => store.set(KEY, { view: S.view });

    let PROTOS = [], BY = {}, ALL = [];
    const $ = (id) => document.getElementById(id);
    const sh = sheet();

    /* ---------- カード1枚 ---------- */
    function highlight(html, q) {
      if (!q) return html;
      /* タグの中は触らない */
      const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'g');
      return html.split(/(<[^>]+>)/).map(s => (s.startsWith('<') ? s : s.replace(re, '<mark>$1</mark>'))).join('');
    }

    function cardHtml(p, c, q) {
      const zones = ZONES.filter(([k]) => c[k]).map(([k, mark]) =>
        '<span class="z ' + k + '"><i>' + mark + '</i><span>' + highlight(cardText(c[k]), q) + '</span></span>').join('');
      return '<button type="button" class="card" data-id="' + esc(c.id) + '" style="--pc:' + esc(p.color) + '">' +
        '<span class="c-art"><img class="art" alt="" loading="lazy" decoding="async" src="' + cardArt(p.name, c) + '">' +
        '<span class="c-val">' + c.value + '</span><img class="c-emb" alt="" src="' + emblem(p, 48) + '"></span>' +
        '<span class="c-main"><span class="c-head"><span class="c-name">' + esc(p.name) + ' ' + c.value + '</span>' +
        '<span class="c-set">' + esc(p.set) + '</span>' +
        '<span class="c-fx">' + c.effectTypes.map(t => '<span title="' + esc(EFFECT_LABEL[t]) + '">' + effectIcon(t, null, 13) + '</span>').join('') + '</span></span>' +
        '<span class="zones">' + (zones || '<span class="z-none">効果なし</span>') + '</span></span></button>';
    }

    /* ---------- カードの詳しい表示 ---------- */
    function openCard(id) {
      const hit = ALL.find(x => x.c.id === id);
      if (!hit) return;
      const { p, c } = hit;
      const zone = ([k, mark, jp]) => '<div class="dz ' + k + (c[k] ? '' : ' empty') + '"><div class="dz-h">' + mark + ' ' + jp + 'コマンド</div>' +
        '<div class="dz-b">' + (c[k] ? cardText(c[k]) : '効果なし') + '</div></div>';
      const html = '<div class="dt">' +
        '<div class="dt-art"><img class="art" alt="" src="' + cardArt(p.name, c) + '"><span class="c-val">' + c.value + '</span>' +
        '<img class="c-emb" alt="" src="' + emblem(p, 96) + '"></div>' +
        '<div><div class="dt-title"><b>' + esc(p.name) + ' ' + c.value + '</b><span>' + esc(p.set) + '</span></div>' +
        '<p class="dt-tags">' + esc(p.tags) + '</p>' + ZONES.map(zone).join('') +
        '<div class="dt-fx">' + c.effectTypes.map(t => '<span style="color:' + EFFECT_COLOR[t] + ';border-color:' + EFFECT_COLOR[t] + '55">' +
          effectIcon(t, null, 14) + esc(EFFECT_LABEL[t]) + '</span>').join('') + '</div>' +
        (c.codex ? '<div class="codex"><b>CODEX</b>' + esc(c.codex) + '</div>' : '') + '</div>' +
        '<div class="sib"><p class="sib-h">' + esc(p.name) + ' の6枚</p><div class="sib-row">' +
        p.cards.map(x => '<button type="button" data-sib="' + esc(x.id) + '" aria-current="' + (x.id === c.id) + '" aria-label="' + esc(p.name) + ' ' + x.value + '">' +
          '<img alt="" loading="lazy" src="' + cardArt(p.name, x) + '"><b>' + x.value + '</b></button>').join('') + '</div></div></div>';
      const body = sh.open(html, p.color);
      body.querySelectorAll('[data-sib]').forEach(b => b.addEventListener('click', () => openCard(b.dataset.sib)));
    }

    function openProto(name) {
      const p = BY[name];
      const html = '<div class="pv-hero" style="background-image:url(&quot;' + protoArt(p.name) + '&quot;)"><img alt="" src="' + emblem(p, 128) + '">' +
        '<div class="t"><b>' + esc(p.name) + '</b><span>' + esc(p.set) + '</span></div></div>' +
        '<div class="pv-body"><p class="dt-tags">' + esc(p.tags) + '</p>' +
        '<button type="button" class="cp-ghost" id="pvList">カード一覧でこのプロトコルを見る →</button>' +
        '<div class="pv-list cards">' + p.cards.map(c => cardHtml(p, c)).join('') + '</div></div>';
      const body = sh.open(html, p.color);
      body.querySelectorAll('.card').forEach(b => b.addEventListener('click', () => openCard(b.dataset.id)));
      body.querySelector('#pvList').addEventListener('click', () => {
        S.sel = [p.name]; S.fx = 'all'; S.q = ''; $('q').value = '';
        sh.close(); renderFilters(); renderList(); setTab('list');
        window.scrollTo({ top: 0 });
      });
    }

    /* ---------- カード一覧 ---------- */
    function renderFilters() {
      /* プロトコル: セットごとに、まとめて選ぶボタン + 紋章チップ */
      $('ppBody').innerHTML = SETS.map(set => {
        const ps = PROTOS.filter(p => p.set === set);
        const all = ps.every(p => S.sel.includes(p.name));
        return '<div class="pp-set"><button type="button" class="lvl sm" data-set="' + esc(set) + '" aria-pressed="' + all + '">' + esc(set) + '</button>' +
          ps.map(p => protoChip(p, S.sel.includes(p.name))).join('') + '</div>';
      }).join('');
      $('ppNames').textContent = S.sel.length ? S.sel.join(', ') : 'すべて';
      $('fxRow').innerHTML = '<span class="flbl">効果</span>' +
        ['all'].concat(EFFECTS).map(f => '<button type="button" class="lvl sm fx-chip" data-fx="' + f + '" aria-pressed="' + (S.fx === f) + '">' +
          (f === 'all' ? 'すべて' : effectIcon(f, null, 13) + esc(EFFECT_LABEL[f])) + '</button>').join('');
      document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === S.view));
    }

    function renderList() {
      const q = S.q.trim();
      const hits = ALL.filter(({ p, c }) =>
        (!S.sel.length || S.sel.includes(p.name)) &&
        (S.fx === 'all' || c.effectTypes.includes(S.fx)) &&
        (!q || [c.upper, c.middle, c.lower, p.name, p.tags].some(t => t && t.toUpperCase().includes(q.toUpperCase()))));
      $('hits').textContent = hits.length + ' 枚';
      const g = $('grid');
      g.className = 'cards' + (S.view === 'list' ? ' list' : '');
      g.innerHTML = hits.length
        ? hits.map(({ p, c }) => cardHtml(p, c, q)).join('')
        : '<div class="cp-empty">該当するカードがありません</div>';
    }

    /* ---------- プロトコル ---------- */
    function renderProtos() {
      $('protoSets').innerHTML = SETS.map(set =>
        '<div class="set-head"><b>//</b> ' + esc(set) + '</div><div class="proto-grid protos-big">' +
        PROTOS.filter(p => p.set === set).map(p => protoTile(p, {
          tag: p.set,
          extra: ''
        }).replace('</button>', '<span class="proto-tags">' + esc(p.tags) + '</span></button>')).join('') + '</div>').join('');
    }

    /* ---------- 逆引き ---------- */
    function renderLookup() {
      const vals = [...new Set(ALL.map(x => x.c.value))].sort((a, b) => a - b);
      let h = '<thead><tr><th>PROTOCOL</th>' + vals.map(v => '<th>' + v + '</th>').join('') + '</tr></thead><tbody>';
      for (const set of SETS) {
        h += '<tr class="grp"><td colspan="' + (vals.length + 1) + '">' + esc(set) + '</td></tr>';
        for (const p of PROTOS.filter(x => x.set === set)) {
          h += '<tr style="--pc:' + esc(p.color) + '"><th class="rh" scope="row"><span><img alt="" src="' + emblem(p, 44) + '">' + esc(p.name) + '</span></th>';
          for (const v of vals) {
            const c = p.cards.find(x => x.value === v);
            h += c ? '<td><button type="button" class="cell" data-id="' + esc(c.id) + '" aria-label="' + esc(p.name) + ' ' + v + '">' + v + '</button></td>'
              : '<td class="nil">·</td>';
          }
          h += '</tr>';
        }
      }
      $('mx').innerHTML = h + '</tbody>';
    }

    /* ---------- デッキ分析 ---------- */
    function bars(counts, max, colorOf) {
      return '<div class="bars">' + Object.entries(counts).filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]).map(([t, n]) =>
        '<button type="button" class="brow' + (S.anaFx === t ? ' on' : '') + '" data-afx="' + t + '"><span class="blbl">' + effectIcon(t, null, 13) + esc(EFFECT_LABEL[t]) + '</span>' +
        '<span class="btrk"><span class="bfill" style="display:block;width:' + (n / max * 100) + '%;background:' + colorOf(t) + '"></span></span>' +
        '<span class="bval">' + n + '</span></button>').join('') + '</div>';
    }

    function renderAna() {
      $('anaCount').textContent = S.ana.length + ' / 3';
      $('anaPick').innerHTML = SETS.map(set => '<div class="pp-set">' +
        PROTOS.filter(p => p.set === set).map(p => protoChip(p, S.ana.includes(p.name))).join('') + '</div>').join('');
      const out = $('anaOut');
      if (S.ana.length !== 3) {
        S.anaFx = null;
        out.innerHTML = '<div class="cp-empty" style="margin-top:14px">プロトコルを3つ選ぶと、効果の偏りや値の分布が出ます。</div>';
        return;
      }
      const ps = S.ana.map(n => BY[n]);
      const cards = ps.flatMap(p => p.cards.map(c => ({ p, c })));
      const count = (list) => {
        const o = Object.fromEntries(EFFECTS.map(k => [k, 0]));
        list.forEach(({ c }) => c.effectTypes.forEach(t => { o[t]++; }));
        return o;
      };
      const total = count(cards);
      const mx = Math.max(1, ...Object.values(total));
      const byVal = {};
      cards.forEach(({ c }) => { byVal[c.value] = (byVal[c.value] || 0) + 1; });
      const vals = [0, 1, 2, 3, 4, 5, 6];
      const hmx = Math.max(1, ...Object.values(byVal));
      let h = '<div class="ana-sel" style="margin-top:14px">' + ps.map(p => protoTile(p, { attrs: 'data-open="' + esc(p.name) + '"' })).join('') + '</div>' +
        '<div class="ana-grid"><div class="cp-panel ana-card"><h3>効果の種類 (18枚)</h3>' + bars(total, mx, t => EFFECT_COLOR[t]) + '</div>' +
        '<div class="cp-panel ana-card"><h3>値の分布</h3><div class="hist">' + vals.map(v =>
          '<div><small>' + (byVal[v] || 0) + '</small><i style="height:' + ((byVal[v] || 0) / hmx * 72) + 'px"></i><b>' + v + '</b></div>').join('') + '</div></div></div>';
      if (S.anaFx) {
        const f = cards.filter(({ c }) => c.effectTypes.includes(S.anaFx));
        h += '<div class="cp-label"><b>//</b> 「' + esc(EFFECT_LABEL[S.anaFx]) + '」のカード (' + f.length + '枚)</div>' +
          '<div class="cards' + (S.view === 'list' ? ' list' : '') + '">' + f.map(({ p, c }) => cardHtml(p, c)).join('') + '</div>';
      }
      h += '<div class="cp-label"><b>//</b> プロトコル別</div><div class="ana-grid">' + ps.map(p => {
        const o = count(p.cards.map(c => ({ c })));
        return '<div class="cp-panel ana-card"><h3 style="color:' + esc(p.color) + '"><img alt="" src="' + emblem(p, 44) + '">' + esc(p.name) +
          '<span class="c-set">' + esc(p.set) + '</span></h3>' + bars(o, Math.max(1, ...Object.values(o)), () => p.color) + '</div>';
      }).join('') + '</div>';
      out.innerHTML = h;
    }

    /* ---------- タブ ---------- */
    function setTab(tab, push) {
      if (!TABS.includes(tab)) tab = 'list';
      S.tab = tab;
      document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === tab));
      document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + tab));
      if (tab === 'ana') renderAna();
      if (push !== false && location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab);
    }

    /* ---------- 操作 ---------- */
    document.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b || b.closest('#cpSheet')) return;
      if (b.dataset.tab) { setTab(b.dataset.tab); return; }
      if (b.dataset.view) { S.view = b.dataset.view; save(); renderFilters(); renderList(); if (S.tab === 'ana') renderAna(); return; }
      if (b.dataset.fx) { S.fx = b.dataset.fx; renderFilters(); renderList(); return; }
      if (b.dataset.set) {
        const names = PROTOS.filter(p => p.set === b.dataset.set).map(p => p.name);
        const all = names.every(n => S.sel.includes(n));
        S.sel = all ? S.sel.filter(n => !names.includes(n)) : [...new Set(S.sel.concat(names))];
        renderFilters(); renderList(); return;
      }
      if (b.classList.contains('pchip') && b.closest('#ppBody')) {
        const n = b.dataset.name;
        S.sel = S.sel.includes(n) ? S.sel.filter(x => x !== n) : S.sel.concat(n);
        renderFilters(); renderList(); return;
      }
      if (b.classList.contains('pchip') && b.closest('#anaPick')) {
        const n = b.dataset.name;
        if (S.ana.includes(n)) S.ana = S.ana.filter(x => x !== n);
        else if (S.ana.length < 3) S.ana = S.ana.concat(n);
        renderAna(); return;
      }
      if (b.dataset.afx) { S.anaFx = S.anaFx === b.dataset.afx ? null : b.dataset.afx; renderAna(); return; }
      if (b.id === 'anaReset') { S.ana = []; S.anaFx = null; renderAna(); return; }
      if (b.id === 'reset') { S.sel = []; S.fx = 'all'; S.q = ''; $('q').value = ''; renderFilters(); renderList(); return; }
      if (b.dataset.open) { openProto(b.dataset.open); return; }
      if (b.classList.contains('proto') && b.closest('#protoSets')) { openProto(b.dataset.name); return; }
      if (b.dataset.id) { openCard(b.dataset.id); }
    });

    let qTimer = 0;
    $('q').addEventListener('input', (e) => {
      clearTimeout(qTimer);
      qTimer = setTimeout(() => { S.q = e.target.value; renderList(); }, 120);
    });

    window.addEventListener('hashchange', () => setTab(location.hash.slice(1), false));

    /* スマホ: 左右のスワイプでタブを移る */
    (function () {
      let x0 = 0, y0 = 0, on = false;
      const main = document.querySelector('main');
      main.addEventListener('touchstart', (e) => {
        if (e.target.closest('.mx-wrap, .tabs, input')) { on = false; return; }
        x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; on = true;
      }, { passive: true });
      main.addEventListener('touchend', (e) => {
        if (!on) return;
        on = false;
        const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
        if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
        const i = TABS.indexOf(S.tab) + (dx < 0 ? 1 : -1);
        if (i >= 0 && i < TABS.length) { setTab(TABS[i]); window.scrollTo({ top: 0 }); }
      });
    })();

    /* タブを上部バーのすぐ下に貼り付ける */
    const fitTop = () => document.documentElement.style.setProperty('--top-h', document.querySelector('.cp-top').offsetHeight + 'px');
    fitTop();
    window.addEventListener('resize', fitTop);

    /* ---------- はじめ ---------- */
    try {
      PROTOS = await loadProtocols();
      BY = Object.fromEntries(PROTOS.map(p => [p.name, p]));
      ALL = PROTOS.flatMap(p => p.cards.map(c => ({ p, c })));
      $('total').textContent = PROTOS.length + ' PROTOCOLS · ' + ALL.length + ' CARDS';
      renderFilters();
      renderList();
      renderProtos();
      renderLookup();
      setTab(location.hash.slice(1) || 'list', false);
    } catch (err) {
      $('grid').innerHTML = '<div class="cp-empty">カードデータを読み込めませんでした。ページを読み直してください。</div>';
      setTab('list', false);
      console.error(err);
    }
  </script>
</body>
</html>

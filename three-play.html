<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COMPILE — 3D ARENA</title>
<style>
  /* iPhone の Safari は横向きにすると文字を自動で拡大する。スマホ向けに詰めた文字が
     実機では大きく膨らみ、効果の選択などの UI が画面を覆っていたので止める */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  :root{
    --pink:#ff3b9d; --cyan:#63f3ff; --mint:#6dffc2; --gold:#efd06c;
    --ink:#e9eef8; --dim:rgba(233,238,248,.52);
    --glass:rgba(6,9,18,.78); --edge:rgba(255,255,255,.11);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03040a;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);}
  #stage{position:fixed;inset:0;}
  #stage canvas{display:block;}

  /* ---------- 共通の板 ---------- */
  .panel{
    background:var(--glass);border:1px solid var(--edge);border-radius:12px;
    backdrop-filter:blur(14px);box-shadow:0 14px 42px rgba(0,0,0,.5);
  }

  /* ---------- 上部: ターン + ライン ---------- */
  #topbar{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;
    align-items:flex-start;justify-content:space-between;gap:14px;pointer-events:none;
    padding:12px calc(14px + env(safe-area-inset-right)) 12px calc(14px + env(safe-area-inset-left));}
  #brand{display:flex;align-items:center;gap:9px;font:800 13px/1 system-ui;letter-spacing:.22em;}
  #topRight{display:flex;align-items:center;gap:6px;margin-left:auto;}
  #topRight .btn{width:auto;min-width:0;min-height:26px;padding:0 12px;font-size:10px;pointer-events:auto;}
  #topRight #btnMute{padding:0 9px;font-size:12px;}
  #brand b{color:var(--pink);}
  #brand span{color:var(--cyan);}

  #turnBadge{
    padding:7px 15px;border-radius:999px;font:800 11px/1 system-ui;letter-spacing:.16em;
    border:1px solid rgba(255,59,157,.45);background:rgba(255,59,157,.13);color:#ffc7e4;
    transition:all .3s;
  }
  #turnBadge.mine{border-color:rgba(109,255,194,.5);background:rgba(109,255,194,.14);color:#c9ffe9;
    box-shadow:0 0 26px rgba(109,255,194,.2);}

  #lines{position:fixed;left:50%;top:11px;transform:translateX(-50%);z-index:10;
    display:flex;gap:9px;pointer-events:none;}
  .lane{width:172px;padding:7px 9px 8px;border-radius:11px;
    background:rgba(5,8,16,.7);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);}
  .lane-opp,.lane-me{display:flex;align-items:center;justify-content:space-between;gap:8px;
    font:700 9px/1.4 system-ui;letter-spacing:.1em;padding:2px 4px;border-radius:5px;}
  .lane-opp{color:rgba(255,150,200,.78);}
  .lane-me{color:rgba(150,255,215,.82);}
  .lane b{font:900 15px/1 system-ui;color:var(--ink);}
  .lane-proto{display:flex;align-items:center;gap:5px;}
  .chk{font-style:normal;font-size:10px;}
  /* コンパイル済みのラインは塗りつぶして「終わった」ことを示す */
  .lane-me.done{background:rgba(109,255,194,.9);color:#04120c;}
  .lane-me.done b{color:#04120c;}
  .lane-opp.done{background:rgba(255,59,157,.9);color:#22040f;}
  .lane-opp.done b{color:#22040f;}

  /* コンパイル進捗 (●●○) */
  .progress{display:flex;gap:4px;margin-top:3px;}
  .progress i{width:16px;height:4px;border-radius:2px;background:rgba(255,255,255,.14);}
  #meProgress i.on{background:var(--mint);box-shadow:0 0 9px var(--mint);}
  #oppProgress i.on{background:var(--pink);box-shadow:0 0 9px var(--pink);}
  .lane-bar{position:relative;height:4px;margin:5px 0;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;}
  .lane-bar i,.lane-bar u{position:absolute;top:0;height:2px;border-radius:2px;transition:width .45s cubic-bezier(.16,1,.3,1);}
  .lane-bar i{bottom:0;top:auto;background:var(--mint);box-shadow:0 0 9px var(--mint);}
  .lane-bar u{background:var(--pink);box-shadow:0 0 9px var(--pink);}
  .lane.done-me{border-color:rgba(109,255,194,.5);box-shadow:0 0 22px rgba(109,255,194,.13);}
  .lane.done-opp{border-color:rgba(255,59,157,.5);box-shadow:0 0 22px rgba(255,59,157,.13);}

  /* ---------- 左右のカウンタ ---------- */
  .counts{position:fixed;z-index:10;display:flex;flex-direction:column;gap:5px;
    padding:9px 11px;border-radius:11px;background:rgba(5,8,16,.66);border:1px solid var(--edge);
    backdrop-filter:blur(12px);font:700 9px/1.5 system-ui;letter-spacing:.1em;color:var(--dim);pointer-events:none;}
  .counts b{color:var(--ink);font-size:12px;margin-left:6px;}
  /* 右上に「相手 / 自分」の順でまとめる (右下は山札と重なる) */
  #oppCounts{right:calc(14px + env(safe-area-inset-right));top:52px;}
  #meCounts{right:calc(14px + env(safe-area-inset-right));top:126px;}

  /* ---------- 操作ボタン ----------
     手札の前には置かない。MENU と音は最上部のバー、ログは右のサイドバー、
     リフレッシュは手札の横。ここには縦持ちの「手札を隠す」だけが残る */
  #dock{position:fixed;left:14px;bottom:14px;z-index:12;display:flex;gap:6px;align-items:center;}
  .btn{width:104px;min-height:38px;padding:0 10px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(99,243,255,.28);background:rgba(8,12,22,.86);color:var(--ink);
    display:inline-flex;align-items:center;justify-content:center;text-align:center;
    font:800 10px/1 system-ui;letter-spacing:.1em;white-space:nowrap;backdrop-filter:blur(10px);transition:all .2s;}
  .btn:hover{border-color:var(--cyan);background:rgba(99,243,255,.13);
    box-shadow:0 0 22px rgba(99,243,255,.18);transform:translateY(-1px);}
  .btn.on{border-color:var(--gold);background:rgba(239,208,108,.16);color:#ffeab4;}
  .btn[hidden]{display:none;}
  #dock .btn{width:auto;min-width:52px;min-height:30px;padding:0 13px;}
  /* リフレッシュ: 手札の右脇 (--hand-right / --hand-side は main.js が手札の位置から計算) */
  #btnRefresh{position:fixed;z-index:12;left:var(--hand-right, calc(50% + 300px));bottom:var(--hand-side, 22px);
    width:auto;min-height:40px;padding:0 18px;font-size:11px;transition:left .22s cubic-bezier(.16,1,.3,1),opacity .2s,border-color .2s;}
  /* いま補充できないときは薄くする (押せば理由を出す) */
  #btnRefresh.idle{opacity:.42;}
  #btnRefresh.idle:hover{opacity:.7;}
  .btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
  /* 打つ手が補充しかないときは、そこへ誘導する */
  .btn.urge{border-color:var(--mint);background:rgba(109,255,194,.18);color:#c9ffe9;
    animation:btnUrge 1.5s ease-in-out infinite;}
  @keyframes btnUrge{0%,100%{box-shadow:0 0 0 0 rgba(109,255,194,.34)}
    50%{box-shadow:0 0 26px 4px rgba(109,255,194,.28)}}

  /* ---------- プロンプト ---------- */
  #prompt{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:11;
    padding:8px 18px;border-radius:999px;font:700 11px/1 system-ui;letter-spacing:.06em;
    background:rgba(6,9,18,.86);border:1px solid rgba(99,243,255,.3);color:#cfefff;
    backdrop-filter:blur(12px);transition:opacity .25s;}
  #prompt.hidden{opacity:0;}
  #prompt[data-tone="ask"]{border-color:var(--gold);color:#ffeab4;box-shadow:0 0 26px rgba(239,208,108,.16);}
  #prompt[data-tone="end"]{border-color:var(--pink);color:#ffc7e4;}


  /* ---------- 画面フラッシュ ---------- */
  #flash{position:fixed;inset:0;z-index:44;opacity:0;pointer-events:none;mix-blend-mode:screen;}

  /* ---------- コンパイル カットイン ---------- */
  #compileCut{position:fixed;inset:0;z-index:46;display:none;overflow:hidden;pointer-events:none;}
  #compileCut.show{display:block;}
  .cc-veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(3,4,10,.55),rgba(3,4,10,.94));
    animation:ccVeil 2.2s cubic-bezier(.16,1,.3,1) forwards;}
  .cc-art{position:absolute;left:50%;top:50%;width:min(72vh,58vw);aspect-ratio:1/1.1;
    transform:translate(-50%,-50%) scale(1.18);background-size:cover;background-position:center 28%;
    opacity:0;filter:saturate(1.2) contrast(1.15);
    mask-image:radial-gradient(ellipse at 50% 45%,#000 56%,transparent 88%);
    animation:ccArt 2.2s cubic-bezier(.16,1,.3,1) forwards;}
  .cc-emblem{position:absolute;left:50%;top:50%;width:min(58vh,52vw);
    transform:translate(-50%,-52%);opacity:0;pointer-events:none;
    animation:ccEmblem 2.2s cubic-bezier(.16,1,.3,1) forwards;}
  @keyframes ccEmblem{0%{opacity:0;transform:translate(-50%,-52%) scale(1.3) rotate(-6deg)}
    16%{opacity:.3}70%{opacity:.22;transform:translate(-50%,-52%) scale(1.02) rotate(0deg)}
    100%{opacity:0;transform:translate(-50%,-52%) scale(.98)}}
  .cc-slash{position:absolute;left:-20%;right:-20%;height:var(--h,86px);top:var(--t,42%);
    transform:skewY(-4deg) scaleX(0);transform-origin:left center;
    background:linear-gradient(90deg,transparent,var(--accent) 18%,#fff 50%,var(--accent) 82%,transparent);
    opacity:.9;filter:blur(0.5px);animation:ccSlash 2.2s cubic-bezier(.16,1,.3,1) forwards;}
  .cc-slash.thin{--h:3px;--t:calc(42% + 96px);animation-delay:.07s;opacity:.75;}
  .cc-body{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;align-items:center;gap:10px;}
  .cc-kicker{font:800 12px/1 system-ui;letter-spacing:.62em;color:var(--accent);
    opacity:0;animation:ccKick 2.2s cubic-bezier(.16,1,.3,1) forwards;text-shadow:0 0 22px var(--accent);}
  .cc-name{font:900 clamp(44px,10vw,132px)/.92 system-ui;letter-spacing:.06em;color:#fff;
    text-shadow:0 0 40px var(--accent),0 0 90px rgba(0,0,0,.9);
    opacity:0;transform:translateY(26px) scale(.94);
    animation:ccName 2.2s cubic-bezier(.16,1,.3,1) forwards;}
  .cc-sub{font:800 13px/1 system-ui;letter-spacing:.16em;color:rgba(255,255,255,.82);
    opacity:0;animation:ccSub 2.2s cubic-bezier(.16,1,.3,1) forwards;}
  .cc-owner{font:800 11px/1 system-ui;letter-spacing:.3em;
    padding:6px 16px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);
    opacity:0;animation:ccSub 2.2s cubic-bezier(.16,1,.3,1) .06s forwards;}
  .cc-scan{position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,transparent 1px 4px);
    animation:ccVeil 2.2s linear forwards;}
  @keyframes ccVeil{0%{opacity:0}12%{opacity:1}76%{opacity:1}100%{opacity:0}}
  @keyframes ccArt{0%{opacity:0;transform:translate(-50%,-50%) scale(1.28)}
    18%{opacity:.92}72%{opacity:.72;transform:translate(-50%,-50%) scale(1.03)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.0)}}
  @keyframes ccSlash{0%{transform:skewY(-4deg) scaleX(0);opacity:0}
    10%{transform:skewY(-4deg) scaleX(1);opacity:1}
    62%{transform:skewY(-4deg) scaleX(1);opacity:.85}
    100%{transform:skewY(-4deg) scaleX(1);opacity:0}}
  @keyframes ccName{0%{opacity:0;transform:translateY(26px) scale(.94)}
    16%{opacity:1;transform:translateY(0) scale(1)}
    22%{transform:translateY(0) scale(1.015)}
    74%{opacity:1;transform:translateY(0) scale(1)}
    100%{opacity:0;transform:translateY(-14px) scale(1.04)}}
  @keyframes ccKick{0%{opacity:0;letter-spacing:1.2em}14%{opacity:1;letter-spacing:.62em}
    74%{opacity:1}100%{opacity:0}}
  @keyframes ccSub{0%{opacity:0}22%{opacity:1}74%{opacity:1}100%{opacity:0}}


  /* ---------- ターン開始バナー ---------- */
  #turnCut{position:fixed;inset:0;z-index:43;display:none;overflow:hidden;pointer-events:none;}
  #turnCut.show{display:block;}
  .tc-band{position:absolute;left:-15%;right:-15%;top:calc(50% - 46px);height:92px;
    transform:skewY(-3deg) scaleX(0);transform-origin:var(--from,left) center;
    background:linear-gradient(90deg,transparent,var(--accent) 26%,var(--accent) 74%,transparent);
    opacity:.22;animation:tcBand 1.25s cubic-bezier(.16,1,.3,1) forwards;}
  .tc-line{position:absolute;left:-15%;right:-15%;height:2px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    transform:scaleX(0);transform-origin:var(--from,left) center;
    animation:tcLine 1.25s cubic-bezier(.16,1,.3,1) forwards;}
  .tc-line.a{top:calc(50% - 48px);}
  .tc-line.b{top:calc(50% + 46px);animation-delay:.05s;}
  .tc-text{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
    font:900 clamp(30px,6.4vw,74px)/1 system-ui;letter-spacing:.2em;color:#fff;
    text-shadow:0 0 34px var(--accent),0 4px 30px rgba(0,0,0,.8);
    opacity:0;animation:tcText 1.25s cubic-bezier(.16,1,.3,1) forwards;}
  .tc-sub{position:absolute;left:0;right:0;top:calc(50% + 54px);text-align:center;
    font:800 10px/1 system-ui;letter-spacing:.44em;color:var(--accent);
    opacity:0;animation:tcSub 1.25s cubic-bezier(.16,1,.3,1) .08s forwards;}
  @keyframes tcBand{0%{transform:skewY(-3deg) scaleX(0);opacity:0}
    22%{transform:skewY(-3deg) scaleX(1);opacity:.28}
    64%{opacity:.24}100%{transform:skewY(-3deg) scaleX(1);opacity:0}}
  @keyframes tcLine{0%{transform:scaleX(0);opacity:0}20%{transform:scaleX(1);opacity:1}
    66%{opacity:.9}100%{transform:scaleX(1);opacity:0}}
  @keyframes tcText{0%{opacity:0;letter-spacing:.62em;transform:translateY(-50%) scale(.96)}
    24%{opacity:1;letter-spacing:.2em;transform:translateY(-50%) scale(1)}
    66%{opacity:1}100%{opacity:0;transform:translateY(-50%) scale(1.03)}}
  @keyframes tcSub{0%{opacity:0}30%{opacity:1}66%{opacity:1}100%{opacity:0}}

  /* ---------- 効果発動バナー ---------- */
  #fxBanner{position:fixed;left:50%;top:118px;transform:translateX(-50%) translateY(-8px);z-index:20;
    display:flex;align-items:center;gap:12px;padding:9px 20px 9px 14px;border-radius:999px;
    background:linear-gradient(100deg,rgba(8,11,22,.95),rgba(12,16,30,.9));
    border:1px solid var(--accent,#63f3ff);box-shadow:0 0 34px rgba(99,243,255,.2),0 14px 40px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;max-width:min(660px,86vw);}
  #fxBanner.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #fxBanner .fx-name{font:900 12px/1 system-ui;letter-spacing:.16em;color:var(--accent,#63f3ff);
    white-space:nowrap;padding-right:12px;border-right:1px solid rgba(255,255,255,.14);}
  #fxBanner .fx-zone{font:800 10px/1 system-ui;letter-spacing:.1em;color:var(--accent,#63f3ff);
    padding:3px 7px;border:1px solid currentColor;border-radius:6px;opacity:.95;}
  #fxBanner .fx-text{font:600 12px/1.4 system-ui;color:var(--ink);overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

  /* 宣言の演出 (LUCK 0 / LUCK 3): 画面中央で宣言と当否を見せる */
  #declareCut{position:fixed;inset:0;z-index:42;display:flex;align-items:center;justify-content:center;
    pointer-events:none;opacity:0;transition:opacity .18s;}
  #declareCut.show{opacity:1;}
  #declareCut .dc-body{--accent:#63f3ff;text-align:center;padding:22px 46px;border-radius:18px;
    background:radial-gradient(120% 120% at 50% 0%,rgba(10,14,28,.96),rgba(4,6,14,.92));
    border:2px solid var(--accent);box-shadow:0 0 60px color-mix(in srgb,var(--accent) 45%,transparent),
      0 24px 70px rgba(0,0,0,.7);
    transform:scale(.9);animation:dcPop .34s cubic-bezier(.16,1,.3,1) forwards;}
  #declareCut[data-tone="hit"] .dc-body{--accent:#6dffc2;}
  #declareCut[data-tone="miss"] .dc-body{--accent:#ff3b9d;}
  #declareCut .dc-label{font:800 12px/1 system-ui;letter-spacing:.28em;color:var(--accent);margin-bottom:10px;}
  #declareCut .dc-value{font:900 clamp(38px,9vw,76px)/1 system-ui;letter-spacing:.04em;color:#fff;
    text-shadow:0 0 28px color-mix(in srgb,var(--accent) 60%,transparent);}
  #declareCut .dc-note{margin-top:10px;font:700 12px/1.4 system-ui;color:var(--dim);}
  @keyframes dcPop{from{transform:scale(.9);}to{transform:scale(1);}}
  @media (prefers-reduced-motion: reduce){ #declareCut .dc-body{animation:none;transform:none;} }

  /* ---------- フェイズの合図 ----------
     ターンの構造 (START → CONTROL CHECK → COMPILE CHECK → ACTION →
     CACHE CHECK → END) を、横に走る帯で見せる。 */
  #phaseChip{position:fixed;left:0;right:0;top:84px;z-index:23;height:52px;
    display:flex;align-items:center;justify-content:center;pointer-events:none;
    opacity:0;transition:opacity .18s;}
  #phaseChip.show{opacity:1;}
  #phaseChip .ph-band{position:absolute;left:0;right:0;top:50%;height:34px;transform:translateY(-50%) scaleX(0);
    transform-origin:left center;
    background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 26%,transparent) 22%,
      color-mix(in srgb,var(--accent) 12%,transparent) 78%,transparent);
    border-top:1px solid color-mix(in srgb,var(--accent) 55%,transparent);
    border-bottom:1px solid color-mix(in srgb,var(--accent) 55%,transparent);}
  #phaseChip.show .ph-band{animation:phBand 1.5s cubic-bezier(.16,1,.3,1) forwards;}
  #phaseChip[data-side="opp"] .ph-band{transform-origin:right center;}
  #phaseChip .ph-body{position:relative;display:flex;align-items:center;gap:12px;
    padding:0 18px;opacity:0;}
  #phaseChip.show .ph-body{animation:phBody 1.5s cubic-bezier(.16,1,.3,1) forwards;}
  #phaseChip .ph-en{font:900 clamp(16px,3.4vw,24px)/1 system-ui;letter-spacing:.28em;color:#fff;
    text-shadow:0 0 22px var(--accent);}
  #phaseChip .ph-rule{width:1px;height:18px;background:color-mix(in srgb,var(--accent) 70%,transparent);}
  #phaseChip .ph-ja{font:800 10px/1 system-ui;letter-spacing:.16em;color:var(--accent);}
  @keyframes phBand{0%{transform:translateY(-50%) scaleX(0)}
    22%{transform:translateY(-50%) scaleX(1)}
    76%{transform:translateY(-50%) scaleX(1);opacity:1}
    100%{transform:translateY(-50%) scaleX(1);opacity:0}}
  @keyframes phBody{0%{opacity:0;transform:translateX(-14px)}
    26%{opacity:1;transform:translateX(0)}
    80%{opacity:1}100%{opacity:0}}
  #phaseChip[data-side="opp"] .ph-body{animation-name:phBodyOpp;}
  @keyframes phBodyOpp{0%{opacity:0;transform:translateX(14px)}
    26%{opacity:1;transform:translateX(0)}
    80%{opacity:1}100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){
    #phaseChip .ph-band,#phaseChip .ph-body{animation:none!important;opacity:1;transform:translateY(-50%) scaleX(1);}
    #phaseChip .ph-body{transform:none;}
  }
  @media (max-width:860px) and (orientation:portrait){ #phaseChip{top:66px;height:44px;} #phaseChip .ph-band{height:28px;} }

  /* 効果で選択を求める間だけ表示する、操作の発動元と内容。 */
  #effectContext{position:fixed;left:50%;top:118px;transform:translateX(-50%);z-index:22;
    display:none;align-items:center;gap:9px;max-width:min(720px,90vw);padding:8px 13px;border-radius:10px;
    border:1px solid var(--accent,#63f3ff);background:rgba(5,10,20,.94);box-shadow:0 8px 28px rgba(0,0,0,.42);
    color:var(--ink);font:700 11px/1.3 system-ui;pointer-events:none;}
  #effectContext.show{display:flex;}
  #effectContext b{flex:none;color:var(--accent,#63f3ff);font:900 11px/1 system-ui;letter-spacing:.12em;}
  #effectContext span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #effectContext em{flex:none;padding:3px 6px;border:1px solid color-mix(in srgb,var(--accent,#63f3ff) 72%,transparent);
    border-radius:5px;color:var(--accent,#63f3ff);font-style:normal;font-size:9px;letter-spacing:.08em;}
  /* 選択バーを出している間は、同じ内容の帯を重ねない */
  body.picking #effectContext{display:none;}
  @media (max-width:860px) and (orientation:portrait){#effectContext{top:112px;max-width:calc(100vw - 20px);padding:7px 10px;font-size:10px;}}

  /* ---------- チェーン表示 (効果の途中で別の効果が割り込んだとき) ----------
     マスターデュエルのチェーンのように、処理中の効果を番号付きで積む。
     1番が一番下、いま解決中が一番上。PC は右端、スマホは上部に横並び */
  /* 左は拡大表示と選択パネルが使うので、右端 (LOG のつまみより内側) に積む */
  #chainUi{position:fixed;right:calc(2vw + 34px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);z-index:24;
    display:none;flex-direction:column-reverse;gap:10px;pointer-events:none;}

  @keyframes chIn{from{opacity:0;transform:translateX(30px) scale(.9);}to{opacity:1;transform:translateX(-6px);}}
  /* 鎖: 上下のカードを細い線でつなぐ */
  #chainUi .ch-link + .ch-link::after{content:"";position:absolute;left:30px;bottom:100%;width:3px;height:10px;
    background:linear-gradient(180deg,var(--pc),rgba(255,255,255,.25));border-radius:2px;}
  #chainUi .ch-card{width:62px;aspect-ratio:512/716;border-radius:6px;overflow:hidden;flex:none;

  #chainUi .ch-card img{width:100%;height:100%;object-fit:cover;display:block;}
  #chainUi .ch-card i{display:block;width:100%;height:100%;background:repeating-linear-gradient(45deg,#1a2238 0 6px,#121829 6px 12px);}
  #chainUi .ch-no{position:absolute;left:-10px;bottom:-8px;font:900 italic 30px/1 system-ui;color:#fff;
    -webkit-text-stroke:2px color-mix(in srgb,var(--pc) 80%,#000);text-shadow:0 0 14px var(--pc);}

  @media (max-width:860px) and (orientation:portrait){

    @keyframes chIn{from{opacity:0;transform:translateY(-16px) scale(.9);}to{opacity:1;transform:translateY(4px);}}
    #chainUi .ch-link + .ch-link::after{left:auto;right:100%;bottom:auto;top:26px;width:14px;height:3px;}
    #chainUi .ch-card{width:44px;}
    #chainUi .ch-no{font-size:22px;left:-6px;bottom:18px;}

  @media (prefers-reduced-motion:reduce){ #chainUi .ch-link.enter{animation:none;} }

  /* ---------- 縦持ちのスマホ: 横向きにしてもらう ----------
     スマホは横持ち専用 (PC と同じ UI)。縦向きのタッチ端末では盤面の上に案内を出す */
  #rotateHint{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 40%,#12162a,#03040a 70%);color:var(--ink);}
  #rotateHint .rh-phone{width:58px;height:96px;border:3px solid var(--cyan);border-radius:12px;position:relative;
    box-shadow:0 0 24px rgba(99,243,255,.35);animation:rhTurn 2.4s cubic-bezier(.65,0,.35,1) infinite;}
  #rotateHint .rh-phone::after{content:"";position:absolute;left:50%;bottom:7px;width:14px;height:3px;margin-left:-7px;
    border-radius:2px;background:var(--cyan);opacity:.7;}
  @keyframes rhTurn{0%,25%{transform:rotate(0deg);}55%,100%{transform:rotate(-90deg);}}
  #rotateHint b{font:900 18px/1.4 system-ui;letter-spacing:.08em;}
  #rotateHint span{font:600 12px/1.6 system-ui;color:var(--dim);}
  @media (orientation:portrait) and (max-width:860px) and (pointer:coarse){ #rotateHint{display:flex;} }
  @media (prefers-reduced-motion:reduce){ #rotateHint .rh-phone{animation:none;transform:rotate(-90deg);} }

  /* ---------- 決着カットイン ---------- */
  #resultCut{position:fixed;inset:0;z-index:48;display:none;overflow:hidden;pointer-events:none;}
  #resultCut.show{display:block;}
  .rc-veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(4,5,12,.72),rgba(2,3,8,.97));
    opacity:0;animation:rcVeil 3.6s cubic-bezier(.16,1,.3,1) forwards;}

    align-items:center;justify-content:center;gap:16px;}

  @keyframes rcVeil{0%{opacity:0}8%{opacity:1}88%{opacity:1}100%{opacity:0}}

  @keyframes rcTitle{0%{opacity:0;transform:translateY(30px) scale(.9)}

  @keyframes rcSub{0%{opacity:0}18%{opacity:1}86%{opacity:1}100%{opacity:0}}

    86%{width:min(420px,64vw);opacity:1}100%{width:min(420px,64vw);opacity:0}}

  /* ---------- カードの詳細パネル (マスターデュエル式) ----------
     最後に触ったカード・発動したカードを左上に出したままにする。
     絵は小さく添えるだけにして、効果の文を読ませる。発動した段は金色に光る */
  /* iPhone を横にするとノッチが左右の端に来るので、端から離す (safe-area) */
  #preview{position:fixed;left:calc(14px + env(safe-area-inset-left));top:52px;z-index:26;
    width:clamp(190px,17vw,240px);max-height:calc(100vh - 140px);
    display:flex;flex-direction:column;overflow:hidden;border-radius:10px;
    background:linear-gradient(180deg,rgba(12,16,29,.95),rgba(6,9,18,.95));
    border:1px solid color-mix(in srgb,var(--accent,#63f3ff) 40%,rgba(255,255,255,.08));
    box-shadow:0 22px 56px rgba(0,0,0,.6);backdrop-filter:blur(10px);
    opacity:0;pointer-events:none;transform:translateX(-8px);
    transition:opacity .12s ease-out,transform .16s cubic-bezier(.16,1,.3,1);}
  #preview.show{opacity:1;transform:none;}
  #preview.firing{animation:cpAura 1.1s ease-in-out infinite;}
  @keyframes cpAura{
    0%,100%{box-shadow:0 0 14px 1px var(--accent,#efd06c),0 22px 56px rgba(0,0,0,.6);}
    50%{box-shadow:0 0 30px 6px var(--accent,#efd06c),0 22px 56px rgba(0,0,0,.6);}}
  .cp-head{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;
    background:linear-gradient(90deg,color-mix(in srgb,var(--accent,#63f3ff) 62%,#0a0f1c),color-mix(in srgb,var(--accent,#63f3ff) 16%,#0a0f1c));}
  .cp-head b{flex:1;min-width:0;font:900 14px/1.15 system-ui;letter-spacing:.08em;color:#fff;
    text-shadow:0 1px 6px rgba(0,0,0,.55);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cp-val{flex:none;display:grid;place-items:center;min-width:26px;height:26px;border-radius:7px;
    font:900 16px/1 system-ui;color:#0a0f1c;background:#fff;font-variant-numeric:tabular-nums;}
  .cp-fire{flex:none;padding:4px 8px;border-radius:999px;font:900 10px/1 system-ui;letter-spacing:.14em;
    color:#1a1405;background:var(--gold);box-shadow:0 0 12px rgba(239,208,108,.6);}
  .cp-top{display:flex;gap:10px;padding:10px 12px 8px;}
  .cp-img{position:relative;flex:none;width:clamp(46px,26%,64px);aspect-ratio:512/716;border-radius:6px;overflow:hidden;
    border:1px solid rgba(255,255,255,.18);background:repeating-linear-gradient(45deg,#1a2238 0 6px,#121829 6px 12px);}
  .cp-img img{display:block;width:100%;height:100%;object-fit:cover;}
  .cp-img i{display:block;width:100%;height:100%;}
  /* 裏向きの自分のカード: 盤面と同じく、裏面ごしに透かして見せる */
  .cp-img.facedown img{opacity:.45;}
  .cp-meta{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;}
  .cp-proto{font:800 12px/1.2 system-ui;letter-spacing:.12em;color:var(--accent,#63f3ff);}
  .cp-tag{padding:2px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.2);
    font:700 10px/1.5 system-ui;color:var(--ink);}
  .cp-note{font:600 11px/1.5 system-ui;color:var(--dim);}
  .cp-rows{display:flex;flex-direction:column;gap:6px;padding:2px 12px 12px;overflow-y:auto;scrollbar-width:thin;}
  .cp-row{padding:7px 9px;border-radius:7px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);}
  .cp-zone{display:block;margin-bottom:3px;font:800 10px/1.2 system-ui;letter-spacing:.1em;color:var(--accent,#63f3ff);}
  .cp-row p{margin:0;font:500 12px/1.55 system-ui;color:var(--ink);}
  .cp-row.off{opacity:.5;}
  .cp-row.off p{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.3);}
  .cp-row.fire{border-color:var(--gold);background:rgba(239,208,108,.12);box-shadow:0 0 16px -4px var(--gold);}
  .cp-row.fire .cp-zone{color:var(--gold);}
  .cp-row.fire p{color:#fff;font-weight:700;}
  @media (prefers-reduced-motion: reduce){ #preview{transition:opacity .12s;} #preview.firing{animation:none;} }
  /* ログと重なるので表示中は手前へ */
  #preview.show{z-index:31;}
  /* トレーニングは左にトレーニングの道具があるので、右 (枚数表示の下) に出す */
  body.training #preview{left:auto;right:calc(48px + env(safe-area-inset-right));top:200px;max-height:calc(100vh - 214px);}

  /* ---------- ログ (右のサイドバー) ----------
     閉じているときは右端のつまみだけを出し、押すと盤面の右から引き出す */
  /* 下端はリフレッシュ・選択解除の段より上で止め、開いていても押せるようにする */
  #logDock{position:fixed;right:env(safe-area-inset-right);top:52px;bottom:74px;z-index:14;width:min(240px,34vw);
    transform:translateX(100%);transition:transform .26s cubic-bezier(.16,1,.3,1);}
  #logDock.open{transform:translateX(0);}
  #log{height:100%;overflow-y:auto;padding:12px 14px;border-radius:12px 0 0 12px;
    background:rgba(5,8,16,.93);border:1px solid rgba(99,243,255,.24);border-right:0;
    backdrop-filter:blur(12px);box-shadow:-18px 0 44px rgba(0,0,0,.5);
    font:500 11px/1.65 system-ui;color:var(--dim);scrollbar-width:thin;
    visibility:hidden;transition:visibility 0s .26s;}
  #logDock.open #log{visibility:visible;transition:none;}
  #log:empty::before{content:"まだ何も起きていません";color:var(--dim);}
  #btnLog{position:absolute;right:100%;top:168px;width:28px;height:78px;padding:0;cursor:pointer;
    border-radius:10px 0 0 10px;border:1px solid rgba(99,243,255,.3);border-right:0;
    background:rgba(8,12,22,.9);color:#cfefff;backdrop-filter:blur(10px);

  #btnLog:hover{border-color:var(--cyan);background:rgba(99,243,255,.14);}
  #btnLog:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
  #logDock.open #btnLog{border-color:var(--gold);color:var(--gold);}
  @media (prefers-reduced-motion:reduce){ #logDock{transition:none;} }
  .log-row{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);color:var(--dim);}
  /* ターンの切れ目は帯にして、どこから誰の番か目で追えるようにする */
  .log-row.turn{margin:6px 0 3px;padding:3px 8px;border:0;border-radius:999px;
    font:800 9px/1.5 system-ui;letter-spacing:.14em;text-align:center;
    background:rgba(255,59,157,.16);color:#ffbcd9;}
  .log-row.turn:first-child{margin-top:0;}
  .log-row.turn[data-mine]{background:rgba(109,255,194,.16);color:#a9ffdc;}
  /* ログの中のカード名は触れる。押すとテキストだけの小さな表示を出す */
  .log-card{appearance:none;border:1px solid rgba(99,243,255,.34);background:rgba(99,243,255,.1);

    cursor:pointer;}
  .log-card:hover,.log-card:focus-visible{background:rgba(99,243,255,.22);outline:none;}

  /* ---------- カードのテキストだけの小さな表示 (ログから引く) ---------- */
  #cardNote{position:fixed;left:14px;bottom:14px;z-index:33;width:min(290px,86vw);
    padding:10px 12px;border-radius:12px;background:rgba(6,9,18,.97);
    border:1px solid var(--accent,#63f3ff);box-shadow:0 18px 50px rgba(0,0,0,.6);
    opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .16s,transform .16s;}
  #cardNote.show{opacity:1;pointer-events:auto;transform:translateY(0);}
  #cardNote .cn-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-bottom:6px;font:800 12px/1.2 system-ui;color:var(--accent,#63f3ff);}
  #cardNote .cn-close{appearance:none;border:0;background:none;color:var(--dim);

  #cardNote .cn-zone{flex:0 0 auto;font:800 9px/1.7 system-ui;color:var(--accent,#63f3ff);opacity:.9;}

  #cardNote .cn-badge{margin-left:auto;margin-right:6px;padding:2px 7px;border-radius:999px;

  #cardNote .cn-row.off .cn-text{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25);}
  #cardNote .cn-row.off .cn-zone{opacity:.45;}
  /* スマホで盤面のカードを触ったときの読みやすい表示 */
  #cardNote.large{padding:12px 14px;}
  #cardNote.large .cn-head{font-size:16px;margin-bottom:8px;}
  #cardNote.large .cn-zone{font-size:11px;line-height:1.9;min-width:34px;}
  #cardNote.large .cn-text{font-size:14px;line-height:1.65;}
  #cardNote.large .cn-row{padding:6px 0;}
  @media (max-width:860px) and (orientation:portrait){

  }

  /* ---------- モーダル ---------- */
  /* 選択中も盤面が見えるよう、暗幕とぼかしは使わず下部に寄せる */
  #modal{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;
    justify-content:flex-end;gap:8px;
    background:linear-gradient(180deg,rgba(2,3,9,0) 42%,rgba(2,3,9,.6) 88%);
    padding-bottom:calc(var(--hand-gap, 14vh) + 12px);}
  #modal.show{display:flex;}
  #modalCard{width:min(560px,92vw);max-height:52vh;overflow-y:auto;padding:16px 20px;
    border-radius:16px;background:linear-gradient(180deg,rgba(11,15,28,.97),rgba(5,7,15,.98));
    border:1px solid rgba(99,243,255,.24);box-shadow:0 30px 90px rgba(0,0,0,.7),0 0 50px rgba(99,243,255,.07);}
  #modalTitle{margin:0 0 14px;font:800 13px/1.4 system-ui;letter-spacing:.1em;color:#cfefff;}
  #modalBody{display:flex;flex-direction:column;gap:7px;}
  .mchoice{padding:11px 14px;text-align:left;cursor:pointer;border-radius:9px;
    border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.035);color:var(--ink);
    font:700 12px/1.4 system-ui;transition:all .16s;}
  .mchoice small{color:var(--dim);font-weight:500;margin-left:7px;}
  .mchoice:hover{border-color:var(--cyan);background:rgba(99,243,255,.1);transform:translateX(3px);}
  .mchoice.on{border-color:var(--gold);background:rgba(239,208,108,.14);}

  .mchoice:disabled{opacity:.36;cursor:not-allowed;transform:none;}
  /* 目ボタン: 押すとダイアログを隠して盤面を見る。もう一度で戻る */
  /* ダイアログ右上に添える (ピーク中もこの位置に残る) */
  #modalPeek{align-self:flex-end;margin-right:calc((100% - min(560px,92vw)) / 2);z-index:32;
    width:46px;height:46px;border-radius:12px;cursor:pointer;font-size:22px;line-height:1;
    background:rgba(8,11,21,.85);border:1px solid rgba(99,243,255,.3);color:#cfefff;
    box-shadow:0 8px 26px rgba(0,0,0,.55);transition:border-color .16s,color .16s;}
  #modalPeek:hover{border-color:var(--cyan);background:rgba(99,243,255,.12);}
  /* ピーク中はレイヤーごと素通しにして、盤面のカードをタップで

  #modal.peek{background:transparent;pointer-events:none;}
  #modal.peek #modalCard{opacity:0;pointer-events:none;transform:translateY(14px);}
  #modal.peek #modalPeek{border-color:var(--gold);color:var(--gold);pointer-events:auto;}
  #modalCard{transition:opacity .18s ease-out,transform .2s cubic-bezier(.16,1,.3,1);}

  /* ---------- 手札公開の帯 ---------- */
  #revealOv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);z-index:34;
    padding:16px 20px 12px;border-radius:16px;background:rgba(6,9,18,.96);
    border:1px solid rgba(99,243,255,.3);box-shadow:0 30px 90px rgba(0,0,0,.75);
    opacity:0;pointer-events:none;transition:opacity .18s,transform .2s cubic-bezier(.16,1,.3,1);}
  #revealOv.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
  #revealOv .rv-title{font:800 12px/1 system-ui;letter-spacing:.12em;color:#cfefff;margin-bottom:10px;}
  #revealOv .rv-cards{display:flex;gap:8px;max-width:86vw;overflow-x:auto;}

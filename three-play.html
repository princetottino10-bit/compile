  #revealOv .rv-hint{margin-top:8px;font:600 10px/1 system-ui;color:var(--dim);text-align:center;}

  /* ---------- 山札から選ぶ (CLARITY 3 等のサーチ) ----------
     公開オーバーレイ(34)より前面に出し、選択が隠れないようにする。 */
  #pickOv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);z-index:38;
    padding:16px 20px 12px;border-radius:16px;background:rgba(6,9,18,.97);
    border:1px solid rgba(239,208,108,.55);box-shadow:0 30px 90px rgba(0,0,0,.8);
    opacity:0;pointer-events:none;transition:opacity .18s,transform .2s cubic-bezier(.16,1,.3,1);}
  #pickOv.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
  #pickOv .rv-title{font:800 12px/1 system-ui;letter-spacing:.12em;color:#f4e2a6;margin-bottom:10px;text-align:center;}
  #pickOv .rv-cards{display:flex;gap:10px;max-width:88vw;overflow-x:auto;padding-bottom:4px;}
  #pickOv .rv-pick{margin:0;padding:4px;background:none;border:2px solid transparent;border-radius:12px;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;}
  #pickOv .rv-pick:hover,#pickOv .rv-pick:focus-visible{border-color:#efd06c;outline:none;
    background:rgba(239,208,108,.12);}
  #pickOv .rv-pick img{height:30vh;max-height:250px;border-radius:8px;display:block;}
  #pickOv .rv-pick span{font:700 11px/1.4 system-ui;color:#e8f4ff;}
  #pickOv .rv-hint{margin-top:10px;font:600 10px/1 system-ui;color:var(--dim);text-align:center;}
  @media (max-width:860px) and (orientation:portrait){ #pickOv .rv-pick img{height:24vh;} }

  /* ---------- 盤面の並べ替えチップ ---------- */
  #arrOv{position:fixed;inset:0;z-index:33;pointer-events:none;}
  /* 並べ替えは小さく: 盤面のプロトコル板の上に名前だけの札を浮かべ、操作は手札のすぐ上に */
  .arr-hint{position:fixed;left:50%;top:56px;transform:translateX(-50%);
    padding:6px 14px;border-radius:999px;background:rgba(8,11,21,.86);
    border:1px solid rgba(99,243,255,.3);color:#cfefff;font:700 11px/1 system-ui;letter-spacing:.06em;}
  .arr-chip{position:fixed;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
    padding:6px 12px;border-radius:8px;font:800 11px/1 system-ui;letter-spacing:.08em;
    background:rgba(8,11,21,.8);border:2px solid rgba(99,243,255,.45);color:#eaf4ff;
    box-shadow:0 6px 18px rgba(0,0,0,.5);transition:all .14s;}
  .arr-chip:hover{border-color:var(--cyan);background:rgba(99,243,255,.14);}
  .arr-chip.on{border-color:var(--gold);color:var(--gold);transform:translate(-50%,-50%) scale(1.1);}
  .arr-chip.done{opacity:.75;border-style:dashed;}
  .arr-bar{position:fixed;left:50%;bottom:12vh;transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto;}
  .arr-btn{padding:10px 22px;border-radius:999px;cursor:pointer;font:800 12px/1 system-ui;letter-spacing:.1em;
    background:rgba(8,11,21,.9);border:1px solid rgba(255,255,255,.2);color:var(--ink);transition:all .16s;}
  .arr-btn.ok{border-color:rgba(109,255,194,.5);color:var(--mint);}
  .arr-btn.ok:disabled{opacity:.35;cursor:not-allowed;}
  /* 質問つきの選択バー: 何に答えているのかをボタンのすぐ上に置く */
  .arr-bar.with-ask{flex-direction:column;align-items:center;gap:8px;max-width:min(520px,92vw);
    padding:10px 14px;border-radius:14px;background:rgba(6,9,18,.95);
    border:1px solid rgba(99,243,255,.34);box-shadow:0 18px 50px rgba(0,0,0,.6);}
  .arr-bar .arr-ask{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;justify-content:center;
    font:600 12px/1.6 system-ui;color:var(--ink);text-align:center;}
  .arr-bar .arr-ask b{font:800 11px/1.4 system-ui;letter-spacing:.06em;color:var(--cyan);}
  .arr-bar .arr-btns{display:flex;gap:10px;}
  .arr-btn:hover:not(:disabled){border-color:var(--cyan);}

  /* ---------- 効果の選択UI (盤面の帯・一覧ダイアログ共通) ----------
     発動元カードの色を --accent として、見出しの縁とチップに使う */
  .sel-head{--accent:var(--cyan);display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;}
  .sel-src{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border-radius:999px;cursor:pointer;
    background:color-mix(in srgb,var(--accent) 12%,rgba(8,11,21,.9));
    border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);color:var(--ink);transition:background .15s;}
  .sel-src i{width:14px;height:14px;border-radius:4px;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  .sel-src b{font:800 11px/1 system-ui;letter-spacing:.08em;}
  .sel-src span{font:700 9px/1 system-ui;letter-spacing:.1em;color:var(--dim);padding-left:6px;
    border-left:1px solid rgba(255,255,255,.18);}
  .sel-src:hover{background:color-mix(in srgb,var(--accent) 24%,rgba(8,11,21,.9));}
  .sel-q{font:800 15px/1.45 system-ui;letter-spacing:.02em;color:var(--ink);text-wrap:balance;}
  .sel-meta{display:flex;gap:6px;align-items:center;}
  .sel-tag{padding:2px 8px;border-radius:999px;font:800 9px/1.5 system-ui;letter-spacing:.14em;
    color:var(--dim);border:1px solid rgba(255,255,255,.2);}
  .sel-count{font:600 11px/1 system-ui;color:var(--dim);font-variant-numeric:tabular-nums;}
  .sel-count b{font-size:15px;color:var(--gold);}
  .sel-hint{font:600 11px/1.5 system-ui;color:var(--dim);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .sel-key{display:inline-block;width:10px;height:10px;border-radius:3px;}
  .sel-key.gold{background:var(--gold);box-shadow:0 0 8px var(--gold);}
  .sel-key.mint{background:var(--mint);box-shadow:0 0 8px var(--mint);margin-left:6px;}
  .sel-arrow{font-style:normal;color:var(--dim);margin:0 8px;}

  /* 盤面の帯 */
  /* PC: 盤面の左の空きに縦長パネルとして置く (手札・レーンに重ねない) */
  .arr-bar.sel-bar{left:24px;top:50%;bottom:auto;transform:translateY(-50%);width:300px;max-width:none;
    align-items:stretch;gap:10px;padding:12px 14px;border-radius:16px;
    background:linear-gradient(180deg,rgba(12,16,30,.97),rgba(6,8,17,.97));
    border:1px solid rgba(99,243,255,.22);box-shadow:0 20px 60px rgba(0,0,0,.65);}
  .arr-bar.sel-bar .arr-btns{justify-content:flex-end;flex-wrap:wrap;gap:8px;}
  .arr-bar.sel-bar .arr-btn.ok{flex:1;}
  .arr-bar.sel-bar .arr-btn{padding:10px 18px;white-space:nowrap;}
  /* 盤面で選ぶときの指示: マスターデュエルのように上部中央の横長の帯に、何を選ぶかを1行で大きく出す。
     「何を」の語は金色。発動元・ヒント・ボタンは帯の下段に小さくまとめる。
     左の詳細パネルとは重ねない幅にする */
  .arr-bar.sel-bar:not(.confirm){left:50%;top:60px;transform:translateX(-50%);z-index:20;
    width:min(720px,calc(100vw - 2 * (clamp(190px,17vw,240px) + 30px + env(safe-area-inset-left))));
    flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 12px;
    padding:12px 22px 10px;border-radius:3px;border:0;
    border-top:1px solid rgba(160,190,230,.42);border-bottom:1px solid rgba(160,190,230,.42);
    background:linear-gradient(180deg,rgba(15,20,36,.93),rgba(7,10,20,.93));
    box-shadow:0 14px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);}
  .arr-bar.sel-bar:not(.confirm) .sel-head{flex-direction:row;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 12px;}
  .arr-bar.sel-bar:not(.confirm) .sel-q{font-size:17px;letter-spacing:.04em;text-align:center;}
  .arr-bar.sel-bar:not(.confirm) .arr-btns{justify-content:center;}
  .arr-bar.sel-bar:not(.confirm) .arr-btn{padding:7px 16px;font-size:11px;}
  .arr-bar.sel-bar:not(.confirm) .arr-btn.ok{flex:none;}
  .sel-q em{font-style:normal;color:var(--gold);}
  body.picking #prompt{opacity:0;}
  /* 効果を使うかの確認は、手札のすぐ上の中央に出す (--hand-gap は main.js が手札の上端から計算)。
     盤面に重なるので、目ボタンで一時的に隠して盤面を見られる */
  .arr-bar.sel-bar.confirm{left:50%;top:auto;bottom:calc(var(--hand-gap, 14vh) + 12px);
    transform:translateX(-50%);width:min(440px,calc(100vw - 32px));}
  .arr-bar.sel-bar.confirm .arr-btns{flex-wrap:nowrap;}
  .sel-peek{flex:none;width:42px;height:34px;border-radius:11px;cursor:pointer;font-size:19px;line-height:1;
    background:rgba(8,11,21,.85);border:1px solid rgba(99,243,255,.3);color:#cfefff;
    transition:border-color .16s,color .16s,background .16s;}
  .sel-peek:hover{border-color:var(--cyan);background:rgba(99,243,255,.12);}
  .sel-peek:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
  .arr-bar.sel-bar.confirm.peek{background:transparent;border-color:transparent;box-shadow:none;pointer-events:none;}
  .arr-bar.sel-bar.confirm.peek > :not(.arr-btns),.arr-bar.sel-bar.confirm.peek .arr-btn{visibility:hidden;}
  .arr-bar.sel-bar.confirm.peek .sel-peek{pointer-events:auto;border-color:var(--gold);color:var(--gold);}
  /* 手札の上の帯 (確認・手札を捨てる・並べ替え) は低く: 発動元と質問を1行に、決定は右端に */
  .arr-bar.sel-bar.confirm{gap:8px;padding:10px 14px;}
  .arr-bar.sel-bar.confirm .sel-head{flex-direction:row;align-items:center;flex-wrap:wrap;gap:6px 10px;}
  .arr-bar.sel-bar.confirm .sel-q{font-size:14px;}
  .arr-bar.sel-bar.confirm .arr-btns{justify-content:flex-end;}
  .arr-bar.sel-bar.confirm .arr-btn{padding:8px 16px;}
  /* 並べ替え: 左・中・右の並びを帯の中に出す。タップで2つを入れ替える */
  .arr-order{display:flex;gap:6px;}
  .arr-order .arr-chip{position:static;transform:none;flex:1;padding:8px 6px;font-size:11px;text-align:center;
    box-shadow:none;background:rgba(255,255,255,.04);}
  .arr-order .arr-chip.on{transform:none;background:rgba(239,208,108,.14);}
  .arr-bar.sel-bar.confirm .sel-chosen{justify-content:center;}
  .arr-btn.ok{background:linear-gradient(100deg,rgba(109,255,194,.2),rgba(99,243,255,.14));min-width:92px;}
  .arr-btn.ghost{background:transparent;border-color:transparent;color:var(--dim);letter-spacing:.06em;}
  .arr-btn.ghost:hover{color:var(--ink);border-color:rgba(255,255,255,.2);}
  .sel-chosen{display:flex;flex-wrap:wrap;gap:6px;}
  .sel-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 5px;border-radius:8px;cursor:pointer;
    background:rgba(239,208,108,.12);border:1px solid rgba(239,208,108,.5);color:var(--ink);font:700 11px/1 system-ui;}
  .sel-chip b{display:grid;place-items:center;width:17px;height:17px;border-radius:5px;background:var(--gold);color:#1a1405;font-size:10px;}
  .sel-chip i{font-style:normal;color:var(--dim);margin-left:2px;}

  /* 一覧ダイアログ */
  #modalTitle .sel-head{margin-bottom:2px;}
  #modalBody.sel-arrange{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;}
  #modalBody.sel-arrange .mchoice{padding:8px 10px;font-size:11px;text-align:center;}
  #modalBody.sel-arrange .mchoice:hover{transform:none;}
  #modalBody.sel-cards .mchoice,#modalBody .sel-line{display:flex;align-items:center;gap:12px;}
  .sel-thumb{--pc:#8fa8c8;flex:none;width:34px;height:47px;border-radius:5px;overflow:hidden;display:grid;place-items:center;
    background:rgba(255,255,255,.05);border:1px solid color-mix(in srgb,var(--pc) 60%,transparent);}
  .sel-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .sel-thumb i{font:800 16px/1 system-ui;font-style:normal;color:var(--dim);}
  .sel-cl{flex:1;min-width:0;}
  .sel-no{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--gold);color:#1a1405;font:900 12px/1 system-ui;}
  .mchoice.ghost{background:transparent;border-color:transparent;color:var(--dim);text-align:center;}
  .mchoice.sel-ok{text-align:center;font-size:13px;letter-spacing:.12em;}
  .sel-ln{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:8px;
    border:1px solid rgba(255,255,255,.2);font:900 14px/1 system-ui;color:var(--dim);}
  .sel-lp{display:flex;flex-direction:column;gap:3px;}
  .sel-lp b{font:800 13px/1 system-ui;letter-spacing:.08em;}
  .sel-lp small{margin:0;font:600 10px/1 system-ui;color:var(--dim);}
  .sel-lp em{font-style:normal;font-weight:800;}
  .sel-grid{display:grid;gap:8px;}
  .sel-protos{grid-template-columns:repeat(3,1fr);}
  .sel-proto{--pc:var(--cyan);position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:5px;
    padding:14px 12px 12px;border-radius:10px;cursor:pointer;text-align:left;overflow:hidden;color:var(--ink);
    background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 22%,transparent),rgba(255,255,255,.02) 70%);
    border:1px solid color-mix(in srgb,var(--pc) 45%,transparent);transition:transform .14s,border-color .14s,box-shadow .14s;}
  .sel-proto::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pc);box-shadow:0 0 12px var(--pc);}
  .sel-proto b{font:900 13px/1 system-ui;letter-spacing:.1em;}
  .sel-proto small{font:700 9px/1 system-ui;letter-spacing:.12em;color:var(--dim);}
  .sel-proto:hover,.sel-proto:focus-visible{transform:translateY(-2px);border-color:var(--pc);
    box-shadow:0 8px 24px color-mix(in srgb,var(--pc) 30%,transparent);outline:none;}
  .sel-values{grid-template-columns:repeat(7,1fr);}
  .sel-value{aspect-ratio:3/4;border-radius:10px;cursor:pointer;color:var(--ink);font:900 26px/1 system-ui;
    font-variant-numeric:tabular-nums;background:linear-gradient(180deg,rgba(99,243,255,.1),rgba(255,255,255,.02));
    border:1px solid rgba(99,243,255,.28);transition:transform .14s,border-color .14s,color .14s;}
  .sel-value:hover,.sel-value:focus-visible{transform:translateY(-3px);border-color:var(--gold);color:var(--gold);outline:none;}
  @media (prefers-reduced-motion:reduce){ .sel-proto,.sel-value,.mchoice{transition:none;} }

  /* ---------- 対局後の導線 ---------- */
  #endBar{position:fixed;left:50%;bottom:18vh;transform:translateX(-50%) translateY(8px);z-index:45;
    display:none;flex-direction:column;align-items:center;gap:12px;padding:16px 22px;border-radius:16px;
    background:rgba(6,9,18,.96);border:1px solid rgba(99,243,255,.4);
    box-shadow:0 24px 70px rgba(0,0,0,.7);opacity:0;transition:opacity .2s,transform .2s;}
  #endBar.show{display:flex;opacity:1;transform:translateX(-50%) translateY(0);}
  #endBar .end-title{font:900 16px/1 system-ui;letter-spacing:.16em;color:var(--ink);}
  #endBar .end-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  #endFloat{position:fixed;right:14px;bottom:64px;z-index:45;display:none;}
  #endFloat.show{display:block;}
  @media (max-width:860px) and (orientation:portrait){
    #endBar{left:10px;right:10px;transform:none;width:auto;bottom:14vh;}
    #endBar.show{transform:none;}
    #endFloat{right:10px;bottom:70px;}
  }

  /* ---------- トースト ---------- */
  #toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(12px);z-index:40;
    padding:10px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:all .28s cubic-bezier(.16,1,.3,1);
    background:rgba(8,11,20,.94);border:1px solid rgba(255,59,157,.4);color:#ffd9ec;
    font:700 11px/1 system-ui;letter-spacing:.05em;box-shadow:0 12px 40px rgba(0,0,0,.55);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* デモ中は操作系を隠す */
  body.demo #dock, body.demo #preview, body.demo #btnRefresh{display:none;}
  /* タイトル・モード選択の間は対局中のボタンを出さない (裏から透けていた) */
  body.pregame #dock, body.pregame #topbar, body.pregame #lines, body.pregame .counts,
  body.pregame #logDock, body.pregame #btnRefresh{display:none!important;}
  body.demo #brand::after{content:"DEMO";margin-left:10px;padding:3px 9px;border-radius:999px;
    font-size:9px;letter-spacing:.2em;color:#04120c;background:var(--mint);}

  /* ---------- 起動オーバーレイ ---------- */
  #boot{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:16px;background:#03040a;transition:opacity .6s;}
  #boot.gone{opacity:0;pointer-events:none;}
  #boot h1{margin:0;font:900 26px/1 system-ui;letter-spacing:.3em;}
  #boot h1 b{color:var(--pink);}
  #boot p{margin:0;font:700 10px/1 system-ui;letter-spacing:.28em;color:var(--dim);}
  #bootBar{width:190px;height:2px;border-radius:2px;background:rgba(255,255,255,.09);overflow:hidden;}
  #bootBar i{display:block;height:100%;width:38%;border-radius:2px;background:var(--cyan);
    box-shadow:0 0 12px var(--cyan);animation:slide 1.15s infinite ease-in-out;}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(360%)}}




  /* ---------- ルーム対戦ロビー ---------- */
  #roomOv{position:fixed;inset:0;z-index:57;display:none;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 20%,rgba(16,10,34,.6),rgba(3,4,10,.88));}
  #roomOv.show{display:flex;}
  .ro-panel{width:min(680px,94vw);max-height:88vh;overflow-y:auto;padding:24px 26px;
    border-radius:16px;background:linear-gradient(180deg,rgba(11,15,28,.97),rgba(5,7,15,.98));
    border:1px solid rgba(99,243,255,.24);box-shadow:0 30px 90px rgba(0,0,0,.7);
    display:flex;flex-direction:column;gap:12px;}
  .ro-head{font:900 16px/1 system-ui;letter-spacing:.22em;}
  .ro-head b{color:var(--pink);}
  .ro-sub{margin:0;font:500 12px/1.7 system-ui;color:var(--dim);}
  .ro-lbl{font:800 10px/1 system-ui;letter-spacing:.2em;color:var(--cyan);margin-top:6px;}
  .ro-row{display:flex;gap:8px;}
  .ro-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .ro-grid2>div{display:flex;flex-direction:column;gap:7px;}
  .ro-input{padding:11px 13px;border-radius:9px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.05);color:var(--ink);font:600 13px system-ui;flex:1;min-width:0;}
  .ro-input:focus{outline:none;border-color:var(--cyan);}
  .ro-check{font:600 11px system-ui;color:var(--dim);display:flex;gap:6px;align-items:center;}
  /* ドラフトのルール (候補の数・BAN)。ドラフトを外すと薄くして触れなくする */
  .ro-rules{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .ro-rules label{display:flex;flex-direction:column;gap:4px;font:700 10px/1 system-ui;letter-spacing:.12em;color:var(--dim);}
  .ro-rules select{padding:8px 9px;}
  .ro-rules.off{opacity:.35;pointer-events:none;}
  .ro-tag.ban{border-color:rgba(255,59,157,.6);color:#ffb3d6;text-decoration:line-through;text-decoration-color:rgba(255,59,157,.7);}
  .ro-big.ban{background:linear-gradient(100deg,#ff3b9d,#ff7ab8);}
  .ro-btn{padding:11px 18px;border-radius:9px;cursor:pointer;border:1px solid rgba(99,243,255,.35);
    background:rgba(99,243,255,.1);color:#cfefff;font:800 12px system-ui;letter-spacing:.08em;}
  .ro-btn:hover{background:rgba(99,243,255,.2);}
  .ro-big{padding:14px;border-radius:10px;cursor:pointer;border:0;
    font:900 13px system-ui;letter-spacing:.16em;color:#04120c;
    background:linear-gradient(100deg,var(--mint),var(--cyan));}
  .ro-big:disabled{opacity:.35;cursor:not-allowed;}
  .ro-ghost{padding:9px;border-radius:9px;cursor:pointer;background:none;
    border:1px solid rgba(255,255,255,.12);color:var(--dim);font:700 11px system-ui;}
  .ro-ghost:hover{color:var(--ink);border-color:rgba(255,255,255,.3);}
  .ro-status{min-height:16px;font:700 11px system-ui;color:var(--dim);}
  .ro-status[data-type="err"]{color:#ff8cc0;}
  .ro-status[data-type="ok"]{color:var(--mint);}
  .ro-code{font:900 34px/1 ui-monospace,monospace;letter-spacing:.4em;color:var(--gold);
    text-align:center;padding:14px;border:1px dashed rgba(239,208,108,.4);border-radius:10px;}
  .ro-list{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto;}
  .ro-room{padding:10px 13px;text-align:left;border-radius:9px;cursor:pointer;
    border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:var(--ink);
    font:700 12px system-ui;display:flex;justify-content:space-between;gap:8px;}
  .ro-room:hover{border-color:var(--cyan);}
  .ro-room small{color:var(--dim);font:600 10px ui-monospace,monospace;letter-spacing:.14em;}
  .ro-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .ro-chip{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 7px;border-radius:999px;
    cursor:pointer;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.04);
    color:var(--ink);font:700 11px system-ui;letter-spacing:.05em;}
  .ro-chip img{width:20px;height:20px;}
  /* チップの横の「?」: そのプロトコルの6枚を見る */
  .ro-chipwrap{display:inline-flex;align-items:center;gap:3px;}
  .ro-info{width:24px;height:24px;border-radius:999px;cursor:pointer;flex:none;
    border:1px solid rgba(255,255,255,.22);background:rgba(8,11,21,.8);color:var(--dim);font:900 11px/1 system-ui;}
  .ro-info:hover,.ro-info:focus-visible{color:var(--ink);border-color:var(--cyan);outline:none;}
  #roCardsOv{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:rgba(2,3,9,.82);padding:16px;cursor:pointer;}
  #roCardsOv.show{display:flex;}
  #roCardsOv .rc-title{font:800 13px/1 system-ui;letter-spacing:.12em;color:#cfefff;}
  #roCardsOv .rc-cards{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:min(980px,96vw);max-height:78vh;overflow-y:auto;}
  #roCardsOv figure{margin:0;text-align:center;}
  #roCardsOv img{height:min(34vh,260px);border-radius:8px;display:block;}
  #roCardsOv figcaption{font:600 10px/1.6 system-ui;color:var(--dim);}
  #roCardsOv .rc-hint{font:600 10px/1 system-ui;color:var(--dim);}
  /* ロビー: いまのアカウント */
  .ro-account{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 11px/1.4 system-ui;color:var(--dim);}
  .ro-account b{color:var(--ink);}
  .ro-account .ro-ghost{padding:5px 10px;font-size:10px;}
  .ro-chip:hover{border-color:var(--accent,var(--cyan));}
  .ro-chip.on{border-color:var(--accent);background:rgba(255,255,255,.1);
    box-shadow:0 0 0 1px var(--accent);}
  .ro-chip.taken{opacity:.32;cursor:not-allowed;}
  .ro-tag{display:inline-block;margin:2px 4px 2px 0;padding:4px 11px;border-radius:999px;
    border:1px solid rgba(255,255,255,.16);font:700 10.5px system-ui;color:var(--dim);}
  .ro-tag.mine{border-color:var(--mint);color:#c9ffe9;}

  /* ---------- タイトル画面 ---------- */
  /* タイトルの下に対局中のボタンが透けていたので、ほぼ不透明にする */
  #title{position:fixed;inset:0;z-index:58;display:none;overflow:hidden;cursor:pointer;
    background:radial-gradient(ellipse at 50% 30%,rgba(20,8,34,.92),rgba(3,4,10,.985));
    opacity:1;transition:opacity .5s;}
  #title.show{display:block;}
  #title.gone{opacity:0;}
  .tt-scan{position:absolute;inset:0;pointer-events:none;opacity:.4;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px);}
  .tt-log{position:absolute;left:26px;top:48px;font:500 11px/1.9 ui-monospace,monospace;
    color:rgba(109,255,194,.75);text-shadow:0 0 8px rgba(109,255,194,.35);}
  /* 起動ログはロゴの下に敷き、狭い画面では小さくする */
  @media (max-width:860px) and (orientation:portrait){ .tt-log{top:44px;left:14px;font-size:9px;line-height:1.7;max-width:70vw;} .tt-foot{bottom:52px;} }
  .tt-log div{animation:ttLine .18s ease-out;}
  @keyframes ttLine{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  .tt-center{position:absolute;left:0;right:0;top:38%;transform:translateY(-50%);
    display:flex;flex-direction:column;align-items:center;gap:14px;}
  .tt-logo{font:900 clamp(52px,11vw,124px)/1 system-ui;letter-spacing:.1em;color:#fff;
    text-shadow:0 0 44px rgba(255,59,157,.5),0 0 110px rgba(99,243,255,.3);
    animation:ttLogo 1.1s cubic-bezier(.16,1,.3,1) both;}
  .tt-logo b{color:var(--pink);}
  .tt-sub{font:800 15px/1 system-ui;letter-spacing:.72em;color:var(--cyan);
    text-indent:.72em;animation:ttLogo 1.1s cubic-bezier(.16,1,.3,1) .12s both;}
  @keyframes ttLogo{0%{opacity:0;transform:translateY(18px) scale(.96);filter:blur(6px)}
    100%{opacity:1;transform:none;filter:blur(0)}}
  .tt-start{margin-top:34px;font:800 14px/1 system-ui;letter-spacing:.5em;text-indent:.5em;
    color:#ffeab4;padding:14px 34px;border:1px solid rgba(239,208,108,.5);border-radius:999px;
    background:rgba(239,208,108,.07);animation:ttPulse 1.6s ease-in-out .6s infinite both;}
  @keyframes ttPulse{0%,100%{opacity:.55;box-shadow:0 0 0 0 rgba(239,208,108,.0)}
    50%{opacity:1;box-shadow:0 0 30px 2px rgba(239,208,108,.22)}}
  .tt-marquee{position:absolute;left:0;right:0;bottom:64px;overflow:hidden;
    mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);}
  .tt-strip{display:flex;gap:34px;width:max-content;padding:6px 0;
    animation:ttSlide 46s linear infinite;}
  .tt-strip img{width:44px;height:44px;opacity:.6;}
  @keyframes ttSlide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .tt-foot{position:absolute;left:0;right:0;bottom:20px;text-align:center;
    font:700 9px/1 system-ui;letter-spacing:.24em;color:var(--dim);}
  .tt-menu{width:min(590px,88vw);margin-top:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .tt-menu button,.tt-options button{cursor:pointer;text-align:left;padding:15px 17px;border-radius:12px;
    border:1px solid rgba(99,243,255,.28);background:rgba(7,11,23,.82);color:#e9eef8;
    font:900 13px/1.15 system-ui;letter-spacing:.13em;transition:transform .18s,border-color .18s,box-shadow .18s,background .18s;}
  .tt-menu button small{display:block;margin-top:7px;color:var(--dim);font:700 10px/1.2 system-ui;letter-spacing:.06em;}
  .tt-menu button:hover,.tt-menu button:focus-visible,.tt-options button:hover{transform:translateY(-2px);
    border-color:var(--cyan);background:rgba(99,243,255,.12);box-shadow:0 0 26px rgba(99,243,255,.18);outline:0;}
  .tt-menu button[data-mode="training"]{border-color:rgba(109,255,194,.36);}
  .tt-menu button[data-mode="training"]:hover{border-color:var(--mint);background:rgba(109,255,194,.12);box-shadow:0 0 26px rgba(109,255,194,.16);}
  .tt-menu button[data-mode="online"]{border-color:rgba(239,208,108,.34);}
  .tt-menu button[data-mode="online"]:hover{border-color:var(--gold);background:rgba(239,208,108,.12);box-shadow:0 0 26px rgba(239,208,108,.16);}
  .tt-options{width:min(330px,88vw);margin-top:20px;padding:16px;border:1px solid rgba(255,255,255,.13);border-radius:13px;
    background:rgba(5,8,17,.9);box-shadow:0 18px 50px rgba(0,0,0,.45);}
  .tt-options b{display:block;margin-bottom:12px;color:var(--cyan);font:900 12px/1 system-ui;letter-spacing:.2em;}
  .tt-options button{width:100%;margin-top:8px;padding:11px 13px;font-size:11px;}

  /* ---------- トレーニング: 検証盤面の操作パネル ----------
     PC は盤面の左に縦長、スマホは操作ボタンの上に引き出し。
     効果の選択中は選択パネルを優先して、こちらは薄くする */
  #trainingTools{position:fixed;left:calc(14px + env(safe-area-inset-left));top:64px;z-index:18;width:312px;max-height:calc(100vh - 150px);
    display:flex;flex-direction:column;border-radius:14px;overflow:hidden;
    background:linear-gradient(180deg,rgba(10,14,26,.96),rgba(5,8,17,.96));
    border:1px solid rgba(109,255,194,.28);box-shadow:0 18px 50px rgba(0,0,0,.55);transition:opacity .2s;}
  body.training-busy #trainingTools{opacity:.18;pointer-events:none;}
  /* 左はトレーニングパネルが使うので、ログは右の情報欄の間へ */
  #trainingTools button{cursor:pointer;color:var(--ink);font-family:system-ui;}
  .tr-top{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 14px;border-bottom:1px solid rgba(255,255,255,.07);}
  .tr-title{font:900 11px/1 system-ui;letter-spacing:.2em;color:var(--mint);}
  .tr-seg{display:flex;margin-left:auto;padding:2px;border-radius:999px;background:rgba(255,255,255,.06);}
  .tr-seg button{padding:6px 11px;border:0;border-radius:999px;background:transparent;font:800 11px/1 system-ui!important;color:var(--dim)!important;}
  .tr-seg button.on{background:rgba(109,255,194,.2);color:var(--mint)!important;box-shadow:inset 0 0 0 1px rgba(109,255,194,.5);}
  .tr-fold{min-width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:transparent;font-size:12px!important;}
  .tr-body{overflow-y:auto;padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;}
  #trainingTools.collapsed .tr-body{display:none;}
  #trainingTools.collapsed.has-sel .tr-body{display:flex;}
  #trainingTools.collapsed .tr-fold{width:auto;padding:0 12px;border-color:rgba(109,255,194,.5);color:var(--mint);font:800 11px/1 system-ui!important;}
  .tr-sides{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .tr-sides button{padding:8px 0;border-radius:9px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);
    font:800 11px/1 system-ui;letter-spacing:.06em;color:var(--dim)!important;}
  .tr-sides button.me.on{border-color:rgba(109,255,194,.6);color:var(--mint)!important;background:rgba(109,255,194,.1);}
  .tr-sides button.opp.on{border-color:rgba(255,59,157,.6);color:#ff9fcf!important;background:rgba(255,59,157,.1);}
  .tr-groups{display:flex;flex-direction:column;gap:8px;}
  .tr-group{--pc:var(--cyan);}
  .tr-gname{font:900 9px/1 system-ui;letter-spacing:.16em;color:color-mix(in srgb,var(--pc) 60%,#fff);margin:0 0 4px 2px;}
  .tr-tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;}
  .tr-tile{position:relative;padding:0;aspect-ratio:5/7;border-radius:5px;overflow:hidden;
    border:1px solid color-mix(in srgb,var(--pc) 35%,transparent);background:#0a0e1a;transition:transform .12s,border-color .12s;}
  .tr-tile img{width:100%;height:100%;object-fit:cover;display:block;}
  .tr-tile b{position:absolute;right:2px;top:2px;min-width:14px;padding:1px 3px;border-radius:4px;
    background:rgba(0,0,0,.72);font:900 10px/1.1 system-ui;color:#fff;}
  .tr-tile.used img{opacity:.42;filter:saturate(.5);}
  .tr-zone{position:absolute;left:0;right:0;bottom:0;padding:2px 0;font:800 8px/1.1 system-ui;font-style:normal;
    text-align:center;letter-spacing:.06em;background:rgba(0,0,0,.78);color:var(--ink);}
  .tr-zone.z-field{color:var(--mint);}.tr-zone.z-hand{color:var(--cyan);}.tr-zone.z-trash{color:#ff9fcf;}
  .tr-tile:hover{transform:translateY(-2px);border-color:var(--pc);}
  .tr-tile.on{border:2px solid var(--gold);box-shadow:0 0 14px rgba(239,208,108,.55);}
  .tr-tile.on img{opacity:1;filter:none;}
  .tr-sel{--pc:var(--cyan);padding:10px;border-radius:11px;background:rgba(255,255,255,.035);
    border:1px solid color-mix(in srgb,var(--pc) 45%,transparent);display:flex;flex-direction:column;gap:8px;}
  .tr-sel.empty{align-items:center;border-style:dashed;border-color:rgba(255,255,255,.14);}
  .tr-sel.empty span{font:600 11px/1.5 system-ui;color:var(--dim);}
  .tr-sel-head{display:flex;align-items:center;gap:8px;}
  .tr-sel-head b{font:900 13px/1 system-ui;letter-spacing:.08em;color:color-mix(in srgb,var(--pc) 55%,#fff);}
  .tr-sel-head span{padding:2px 7px;border-radius:999px;border:1px solid rgba(255,255,255,.18);font:700 9px/1.4 system-ui;color:var(--dim);}
  .tr-x{margin-left:auto;width:24px;height:24px;border-radius:7px;border:0;background:rgba(255,255,255,.06);}
  .tr-face{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
  .tr-face button{padding:8px 0;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:transparent;font:800 11px/1 system-ui;color:var(--dim)!important;}
  .tr-face button.on{border-color:var(--gold);color:var(--gold)!important;background:rgba(239,208,108,.1);}
  .tr-hint{margin:0;font:600 10px/1.5 system-ui;color:var(--dim);}
  .tr-acts{display:flex;gap:5px;flex-wrap:wrap;}
  .tr-act{flex:1;padding:9px 6px;border-radius:8px;border:1px solid rgba(99,243,255,.3);background:rgba(99,243,255,.07);font:800 11px/1 system-ui;}
  .tr-act:hover{border-color:var(--cyan);background:rgba(99,243,255,.15);}
  .tr-tools{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .tr-tools span{font:700 10px/1 system-ui;color:var(--dim);margin-right:2px;}
  .tr-tools button{flex:1;padding:8px 4px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);font:800 10px/1 system-ui;}
  .tr-tools button:hover{border-color:var(--mint);}
  .tr-foot{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-top:2px;border-top:1px solid rgba(255,255,255,.07);}
  .tr-foot button{margin-top:8px;padding:9px 0;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:transparent;font:800 11px/1 system-ui;}
  .tr-foot button:disabled{opacity:.35;cursor:not-allowed;}
  .tr-share{margin-top:8px;width:100%;padding:10px 0;border-radius:8px;cursor:pointer;
    border:1px solid rgba(239,208,108,.5);background:rgba(239,208,108,.1);color:#ffeab4;font:800 11px/1 system-ui;letter-spacing:.06em;}
  .tr-share:hover{background:rgba(239,208,108,.2);}
  /* ヒントは CPU 戦だけ */
  body.training #btnHint,body.room #btnHint,body.puzzle #btnHint{display:none;}
  /* ---------- 設定・戦績 ---------- */
  .st-row{display:flex;flex-direction:column;gap:6px;font:700 11px/1.4 system-ui;color:var(--dim);letter-spacing:.04em;}
  .st-row i{font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:6px;}
  .st-row input[type=range]{width:100%;accent-color:var(--cyan);}
  .st-check{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;}
  .st-check small{display:block;font-weight:500;font-size:10px;color:var(--dim);margin-top:2px;}
  .st-check input{width:20px;height:20px;accent-color:var(--mint);flex:none;}
  .st-seg{display:flex;gap:6px;}
  .st-seg button,.sr-tabs button{flex:1;padding:8px 0;border-radius:999px;cursor:pointer;border:1px solid rgba(255,255,255,.18);
    background:transparent;color:var(--dim);font:800 11px/1 system-ui;}
  .st-seg button.on,.sr-tabs button.on{border-color:var(--cyan);color:var(--ink);background:rgba(99,243,255,.12);}
  /* タイトル画面 (z 58) の上にも出す */
  #settingsOv,#statsOv{z-index:62;}
  .sr-card{width:min(520px,100%);}
  .sr-total{margin:0;font:600 13px/1.5 system-ui;color:var(--dim);}
  .sr-total b{color:var(--ink);}
  .sr-tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .sr-table{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto;}
  .sr-row{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 44px 70px;align-items:center;gap:8px;
    font:600 11px/1.3 system-ui;color:var(--ink);}
  .sr-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sr-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;}
  .sr-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--cyan));}
  .sr-row b{text-align:right;font-variant-numeric:tabular-nums;}
  .sr-row small{color:var(--dim);font-variant-numeric:tabular-nums;}

  /* ---------- 問題 (共有・解く) ---------- */
  .pz-ov{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(2,3,9,.55);padding:16px;}
  .pz-ov.show{display:flex;}
  .pz-card{width:min(420px,100%);max-height:calc(100vh - 32px);overflow-y:auto;display:flex;flex-direction:column;gap:12px;
    padding:16px 18px;border-radius:14px;background:linear-gradient(180deg,rgba(14,19,34,.98),rgba(7,10,20,.98));
    border:1px solid rgba(239,208,108,.35);box-shadow:0 30px 80px rgba(0,0,0,.7);color:var(--ink);}
  .pz-head{display:flex;align-items:center;justify-content:space-between;font:800 14px/1 system-ui;letter-spacing:.08em;color:#ffeab4;}
  .pz-x{appearance:none;border:0;background:none;color:var(--dim);font:700 18px/1 system-ui;cursor:pointer;}
  .pz-field{display:flex;flex-direction:column;gap:6px;font:700 11px/1.4 system-ui;color:var(--dim);letter-spacing:.06em;}
  .pz-field textarea,.pz-field select,.pz-out input{font:500 13px/1.5 system-ui;color:var(--ink);background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:8px 10px;resize:vertical;}
  .pz-field textarea:focus,.pz-field select:focus{outline:2px solid rgba(239,208,108,.6);outline-offset:1px;}
  .pz-note{margin:0;font:500 11px/1.6 system-ui;color:var(--dim);}
  .pz-main{padding:11px 0;border-radius:999px;border:0;cursor:pointer;font:900 12px/1 system-ui;letter-spacing:.12em;
    color:#1a1405;background:linear-gradient(100deg,var(--gold),#ffe9a3);}
  .pz-out{display:flex;flex-direction:column;gap:8px;}
  .pz-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .pz-row button,.pz-row a{flex:1;min-width:90px;padding:9px 0;border-radius:999px;cursor:pointer;text-align:center;text-decoration:none;
    border:1px solid rgba(255,255,255,.2);background:rgba(8,11,21,.9);color:var(--ink);font:800 11px/1 system-ui;}
  .pz-row .pz-main{border:0;color:#1a1405;background:linear-gradient(100deg,var(--gold),#ffe9a3);}
  .pz-result{text-align:center;padding:6px 0 2px;}
  .pz-result b{display:block;font:900 30px/1.2 system-ui;letter-spacing:.12em;}
  .pz-result.ok b{color:var(--mint);text-shadow:0 0 24px rgba(109,255,194,.5);}
  .pz-result.ng b{color:var(--pink);text-shadow:0 0 24px rgba(255,59,157,.45);}
  .pz-result.free b{color:#cfefff;}
  .pz-result p{margin:8px 0 0;font:600 13px/1.6 system-ui;color:var(--ink);}
  /* 解いている間の課題: 上部の中央 (選択の帯が出ている間は引っ込める) */
  #puzzleBar{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:13;display:flex;align-items:center;gap:10px;
    max-width:min(560px,calc(100vw - 2 * (clamp(190px,17vw,240px) + 30px)));padding:7px 8px 7px 12px;border-radius:12px;
    background:rgba(8,11,21,.9);border:1px solid rgba(239,208,108,.4);box-shadow:0 10px 30px rgba(0,0,0,.5);}
  #puzzleBar .pz-tag{flex:none;padding:3px 8px;border-radius:999px;background:var(--gold);color:#1a1405;font:900 10px/1.2 system-ui;letter-spacing:.1em;}
  #puzzleBar .pz-text{display:flex;flex-direction:column;gap:2px;min-width:0;}
  #puzzleBar .pz-text b{font:800 12px/1.4 system-ui;color:var(--ink);}
  #puzzleBar .pz-text small{font:600 10px/1.3 system-ui;color:#ffeab4;}
  #puzzleBar button{flex:none;padding:7px 12px;border-radius:999px;cursor:pointer;border:1px solid rgba(255,255,255,.2);
    background:transparent;color:var(--ink);font:800 10px/1 system-ui;}
  body.picking #puzzleBar{display:none;}
  .tr-foot button.warn{color:#ffb3d6!important;border-color:rgba(255,59,157,.35);}
  @media (prefers-reduced-motion: reduce){
    .tt-strip{animation:none;}
    .tt-start{animation:none;opacity:1;}
  }
  @media (max-width:700px){
    .tt-center{top:40%;}.tt-menu{grid-template-columns:1fr;gap:7px;margin-top:16px;}.tt-menu button{padding:11px 15px;font-size:12px;}.tt-menu button small{display:inline;margin:0 0 0 8px;}
    #trainingTools{left:8px;right:8px;top:auto;bottom:62px;width:auto;max-height:52vh;}
    .tr-tiles{gap:3px;}
    #trainingTools.has-sel .tr-sides,#trainingTools.has-sel .tr-groups,
    #trainingTools.has-sel .tr-tools,#trainingTools.has-sel .tr-foot{display:none;}
    #trainingTools.has-sel .tr-body{padding-top:8px;}
    #trainingTools.has-sel .tr-top{padding-top:7px;padding-bottom:6px;}
  }

  /* ---------- プロトコル選択 ---------- */
  #setup{position:fixed;inset:0;z-index:55;display:none;flex-direction:column;
    background:radial-gradient(ellipse at 50% 0%,rgba(28,10,42,.55),transparent 55%),#03040a;
    opacity:0;transition:opacity .45s;}
  #setup.show{display:flex;opacity:1;}
  #setupHead{padding:22px 26px 12px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;}
  #setupHead h1{margin:0;font:900 22px/1 system-ui;letter-spacing:.26em;}
  #setupHead h1 b{color:var(--pink);}
  #setupHead p{margin:0;font:600 11px/1.5 system-ui;color:var(--dim);letter-spacing:.05em;}
  #setupCount{margin-left:auto;font:900 15px/1 system-ui;color:var(--mint);letter-spacing:.1em;}
  #setupGrid{flex:1;overflow-y:auto;display:grid;gap:9px;padding:6px 26px 18px;
    grid-template-columns:repeat(auto-fill,minmax(148px,1fr));align-content:start;}
  .proto{position:relative;overflow:hidden;cursor:pointer;text-align:left;
    display:flex;flex-direction:column;justify-content:flex-end;gap:2px;
    height:112px;padding:10px 12px;border-radius:11px;color:var(--ink);
    border:1px solid rgba(255,255,255,.09);background:#080b15;transition:all .18s;}
  .proto-art{position:absolute;inset:0;background-size:cover;background-position:center 22%;
    opacity:.46;transition:all .3s;}
  .proto::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(4,6,13,.15),rgba(4,6,13,.92));}
  .proto-name,.proto-set{position:relative;z-index:1;}
  .proto-emblem{position:absolute;top:8px;right:8px;width:34px;height:34px;z-index:1;
    opacity:.85;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));}
  .proto-name{font:800 13px/1 system-ui;letter-spacing:.12em;}
  .proto-set{font:700 8px/1 system-ui;letter-spacing:.14em;color:var(--dim);}
  .proto:hover{border-color:var(--accent);transform:translateY(-2px);}
  .proto:hover .proto-art{opacity:.72;transform:scale(1.05);}
  .proto.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 30px rgba(0,0,0,.5);}
  .proto.on .proto-art{opacity:.85;}
  .proto.on .proto-name{color:#fff;}
  .proto.dim{opacity:.42;}
  .proto.locked{opacity:.3;cursor:not-allowed;filter:grayscale(.7);}
  #setupFoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:14px 26px 20px;border-top:1px solid rgba(255,255,255,.07);background:rgba(4,6,13,.7);}
  #setupLevels{display:flex;gap:6px;}
  .lvl{padding:9px 15px;border-radius:999px;cursor:pointer;font:800 10px/1 system-ui;letter-spacing:.12em;
    border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:var(--dim);transition:all .18s;}
  .lvl:hover{border-color:var(--cyan);color:var(--ink);}
  .lvl.on{border-color:var(--mint);background:rgba(109,255,194,.14);color:#c9ffe9;}
  #setupStart{padding:13px 34px;border-radius:999px;cursor:pointer;
    font:900 12px/1 system-ui;letter-spacing:.2em;color:#04120c;border:0;
    background:linear-gradient(100deg,var(--mint),var(--cyan));
    box-shadow:0 10px 34px rgba(109,255,194,.24);transition:all .2s;}
  #setupStart:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 40px rgba(109,255,194,.34);}
  #setupStart:disabled{opacity:.3;cursor:not-allowed;box-shadow:none;}
  @media (max-width:700px){
    #setupGrid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));padding:6px 14px 14px;}
    .proto{height:88px;}
    #setupHead,#setupFoot{padding-left:14px;padding-right:14px;}
  }

  @media (max-width:860px) and (orientation:portrait){
    /* 選択バーは手札に重ねず、プロンプト直下の空き領域に置く (.arr-bar より後ろで上書き) */
    .arr-bar{top:13vh;bottom:auto;}
    /* 狭い画面では帯を画面幅いっぱいに (中央寄せの max-content だとボタンが潰れる) */
    .arr-bar.sel-bar{left:10px;right:10px;width:auto;max-width:none;transform:none;top:52px;}
    .arr-bar.sel-bar .arr-btn{flex:1;padding:12px 10px;}
    .arr-bar.sel-bar .arr-btn.ghost{flex:0 0 auto;}
    .arr-bar.sel-bar.confirm{left:10px;right:10px;width:auto;transform:none;top:52px;bottom:auto;}
    .arr-bar.sel-bar:not(.confirm){left:10px;right:10px;width:auto;transform:none;top:52px;}
    #modal{padding-bottom:10vh;}
    .sel-q{font-size:14px;}
    .sel-protos{grid-template-columns:repeat(2,1fr);}
    .sel-values{grid-template-columns:repeat(4,1fr);}
    .sel-value{aspect-ratio:auto;padding:14px 0;}
    #modalCard{width:calc(100vw - 20px);max-height:62vh;}
    #toast{bottom:19vh;}   /* 選択バー (.arr-bar, 12vh) と重ねない */
    /* タップ用: プレビューは中央に大きく (タップで表示、他をタップで消える) */
    /* 縦持ちは触ったカードを右上の小窓 (#cardNote) で読む。詳細パネルは発動のときだけ少し出す */
    #preview{left:auto;right:8px;top:104px;width:min(260px,70vw);max-height:52vh;transform:translateX(8px);}
    #preview.show{transform:none;}
    #lines{top:auto;bottom:74px;gap:6px;}
    .lane{width:104px;padding:5px 7px 6px;}
    #brand{display:none;}
    #logDock{top:100px;bottom:66px;width:min(300px,80vw);}
    #btnLog{top:12px;}
    /* 枚数は見えないと困る。上部に小さく1行ずつ出す (自分=下、相手=上) */
    #oppCounts{top:52px;right:8px;left:auto;bottom:auto;}
    #meCounts{top:76px;right:8px;left:auto;bottom:auto;}
    #meCounts,#oppCounts{flex-direction:row;gap:8px;padding:4px 8px;border-radius:8px;
      font-size:8px;letter-spacing:.06em;background:rgba(5,8,16,.74);}
    #meCounts b,#oppCounts b{font-size:10px;margin-left:3px;}
    /* 下部の操作は指の届く高さに。手札を隠すは左、リフレッシュは右 */
    #dock{left:10px;bottom:12px;}
    #dock .btn{min-height:38px;padding:0 14px;font-size:9px;letter-spacing:.04em;}
    #btnRefresh{left:auto;right:10px;bottom:12px;min-height:38px;font-size:9px;}
  }
  /* ---------- 横持ちのスマホ (高さの低い画面) ----------
     PC と同じ配置のまま、縦が足りないぶんを詰める。
     枚数表示とログは小さくする */
  @media (orientation:landscape) and (max-height:500px){
    #brand{display:none;}
    #topbar{justify-content:flex-end;padding:8px calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left));}
    #btnRefresh{min-height:32px;padding:0 13px;font-size:10px;}
    .lane{width:120px;}
    .counts{padding:5px 8px;gap:2px;font-size:8px;}
    .counts b{font-size:10px;margin-left:3px;}
    #oppCounts{top:48px;right:calc(10px + env(safe-area-inset-right));}
    #meCounts{top:112px;right:calc(10px + env(safe-area-inset-right));bottom:auto;}
    #logDock{top:40px;bottom:52px;width:min(210px,31vw);}
    #log{font-size:10px;}
    #btnLog{top:132px;height:70px;}
    #effectContext{top:44px;}
    #preview{left:calc(8px + env(safe-area-inset-left));top:40px;width:min(200px,24vw);max-height:calc(100vh - 48px);}
    body.training #preview{left:auto;right:calc(44px + env(safe-area-inset-right));top:172px;max-height:calc(100vh - 180px);}
    /* 詳細パネルは小さく (盤面の左のラインを覆わない) */
    #preview{width:min(170px,21vw);max-height:62vh;}
    .cp-head b{font-size:12px;}
    .cp-img{width:40px;}
    .cp-meta{gap:4px;}
    .cp-tag{font-size:9px;padding:1px 6px;}
    .cp-note{font-size:9.5px;}
    .cp-row p{font-size:10px;line-height:1.45;}
    .cp-zone{font-size:9px;margin-bottom:2px;}
    .cp-head{padding:6px 8px 6px 10px;}
    .cp-head b{font-size:13px;}
    .cp-val{min-width:22px;height:22px;font-size:14px;}
    .cp-top{padding:7px 10px 6px;gap:8px;}
    .cp-rows{padding:2px 10px 10px;gap:5px;}
    .cp-row{padding:5px 7px;}
    .cp-row p{font-size:11px;line-height:1.5;}
    #chainUi .ch-card{width:40px;}
    #chainUi .ch-no{font-size:22px;}
    #chainUi .ch-name{font-size:10px;}
    .arr-bar.sel-bar{max-height:calc(100vh - 20px);overflow-y:auto;padding:9px 11px;}
    .arr-bar.sel-bar:not(.confirm){top:40px;width:max(300px,calc(100vw - 2 * (min(200px,24vw) + 18px + env(safe-area-inset-left))));padding:7px 12px 6px;gap:5px 10px;}
    .arr-bar.sel-bar:not(.confirm) .sel-q{font-size:13px;}
    .arr-bar.sel-bar:not(.confirm) .arr-btn{padding:6px 12px;font-size:10px;}
    .arr-bar.sel-bar.confirm{width:min(380px,calc(100vw - 2 * (min(200px,24vw) + 18px + env(safe-area-inset-left))));}
    .sel-q{font-size:13px;}
    #modalCard{max-height:calc(100vh - var(--hand-gap, 14vh) - 84px);}
    #trainingTools{top:40px;max-height:calc(100vh - 50px);width:280px;}
    /* 効果の指示の帯は1行に詰める (高さが足りず、選ぶ対象のカードに被っていた)。
       発動元は色の点だけ、ヒントと選んだ札の一覧は省く (盤面の光と数で分かる)。
       ほかの帯の指定より後ろ・同じ強さで書くため :is(.confirm,:not(.confirm)) を付ける */
    .arr-bar.sel-bar:is(.confirm,:not(.confirm)){flex-direction:row;flex-wrap:nowrap;align-items:center;gap:6px;padding:5px 8px;border-radius:10px;}
    .arr-bar.sel-bar:is(.confirm,:not(.confirm)):has(.arr-order){flex-wrap:wrap;}
    .arr-bar.sel-bar:is(.confirm,:not(.confirm)) .sel-head{flex:1;min-width:0;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:6px;width:auto;}
    .arr-bar.sel-bar:is(.confirm,:not(.confirm)) .sel-src{padding:3px;}
    .arr-bar.sel-bar:is(.confirm,:not(.confirm)) .sel-src b,.arr-bar.sel-bar:is(.confirm,:not(.confirm)) .sel-src span{display:none;}
    .arr-bar.sel-bar:is(.confirm,:not(.confirm)) .sel-q{font-size:11.5px;line-height:1.3;min-width:0;overflow:hidden;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
    .arr-bar.sel-bar:is(.confirm,:not(.confirm)) .sel-hint,.arr-bar.sel-bar:is(.confirm,:not(.confirm)) .sel-chosen,.arr-bar.sel-bar:is(.confirm,:not(.confirm)) .sel-tag{display:none;}
    .arr-bar.sel-bar:is(.confirm,:not(.confirm)) .arr-btns{flex:none;flex-wrap:nowrap;gap:5px;}
    .arr-bar.sel-bar:is(.confirm,:not(.confirm)) .arr-btn{padding:6px 10px;font-size:10px;min-width:0;}
    .arr-bar.sel-bar:is(.confirm,:not(.confirm)) .sel-peek{width:32px;height:28px;font-size:15px;}
    .arr-bar.sel-bar:is(.confirm,:not(.confirm)) .arr-order{width:100%;order:3;}
    .arr-bar.sel-bar:not(.confirm){top:6px;}
    /* 帯の文字の部分は触っても下の盤面に届く (帯の下にある相手のカードもそのまま選べる)。
       反応するのはボタンと発動元の点だけ。下のカードが見えるよう半透明にする */
    .arr-bar.sel-bar:is(.confirm,:not(.confirm)){pointer-events:none;background:rgba(6,9,18,.6);
      border-color:rgba(99,243,255,.28);box-shadow:none;}
    .arr-bar.sel-bar:is(.confirm,:not(.confirm)) :is(button,.sel-src){pointer-events:auto;}
    .arr-bar.sel-bar:is(.confirm,:not(.confirm)) .sel-q{text-shadow:0 1px 4px rgba(0,0,0,.95);}
    /* 選んでいる間は、左の詳細パネルを見出しだけにする (左のラインのカードを隠さない) */
    body.picking #preview .cp-top,body.picking #preview .cp-rows{display:none;}
    /* 一覧で選ぶ: 文字とボタンを小さく、カードは2列に並べる */
    #modalCard{width:min(460px,92vw);padding:10px 12px;}
    #modalTitle{margin-bottom:8px;}
    #modalTitle .sel-q{font-size:13px;}
    #modalBody{gap:5px;}
    #modalBody .mchoice{padding:7px 10px;font-size:11px;border-radius:8px;}
    #modalBody.sel-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}
    #modalBody.sel-cards .mchoice{gap:8px;}
    #modalBody.sel-cards .sel-ok,#modalBody.sel-cards .ghost{grid-column:1 / -1;}
    .sel-thumb{width:24px;height:34px;}
    .sel-ln{width:24px;height:24px;font-size:12px;}
    .sel-lp b{font-size:11px;}
    .sel-lp small{font-size:9px;}
    .sel-proto{padding:9px 9px 8px;}
    .sel-proto b{font-size:11px;}
    .sel-value{font-size:18px;}
    #modalPeek{width:38px;height:38px;font-size:18px;}
  }

</style>
</head>
<body>
  <div id="rotateHint" role="alert">
    <div class="rh-phone" aria-hidden="true"></div>
    <b>スマホを横向きにしてください</b>
    <span>COMPILE は横向きで遊ぶように作っています</span>
  </div>
  <div id="stage"></div>

  <div id="topbar">
    <div id="brand"><b>COMPILE</b><span>3D ARENA</span></div>
    <div id="topRight">
      <div id="turnBadge" class="mine">起動中</div>
      <button id="btnHint" class="btn" type="button" title="AI ならどう指すか">ヒント</button>
      <button id="btnSettings" class="btn" type="button" title="設定" aria-label="設定">⚙</button>
      <button id="btnMute" class="btn" type="button" title="効果音" aria-label="効果音">🔊</button>
      <button id="btnMenu" class="btn" type="button">MENU</button>
      <button id="btnLeave" class="btn" type="button" style="display:none">退出</button>
    </div>
  </div>

  <div id="prompt" class="hidden"></div>

  <div id="oppCounts" class="counts">
    <div>OPPONENT</div>
    <div>DECK<b id="oppDeck">0</b> TRASH<b id="oppTrash">0</b> HAND<b id="oppHand">0</b></div>
    <div class="progress" id="oppProgress"></div>
  </div>
  <div id="meCounts" class="counts">
    <div>YOU</div>
    <div>DECK<b id="meDeck">0</b> TRASH<b id="meTrash">0</b> HAND<b id="meHand">0</b></div>
    <div class="progress" id="meProgress"></div>
  </div>

  <div id="preview"></div>
  <aside id="logDock" aria-label="ログ">
    <button id="btnLog" type="button" aria-expanded="false" aria-controls="log" title="ログ">LOG</button>
    <div id="log"></div>
  </aside>

  <div id="dock">
    <button id="btnFace" class="btn" type="button">表向き</button>
    <button id="btnHand" class="btn" type="button" hidden aria-expanded="true">手札を隠す</button>
  </div>
  <button id="btnRefresh" class="btn" type="button">リフレッシュ</button>

  <div id="flash"></div>
  <div id="compileCut"></div>
  <div id="turnCut"></div>
  <div id="resultCut"></div>
  <div id="fxBanner"></div>
  <div id="effectContext" role="status" aria-live="polite"></div>

  <div id="toast"></div>

  <div id="modal">
    <button id="modalPeek" type="button" title="盤面を見る">&#128065;</button>
    <div id="modalCard">
      <h2 id="modalTitle">選択</h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="title"></div>
  <div id="roomOv"></div>

  <div id="setup">
    <div id="setupHead">
      <h1><b>//</b> PROTOCOL SELECT</h1>
      <p>使用するプロトコルを3つ選ぶ。相手は残りから自動で編成される。</p>
      <span id="setupCount">0 / 3</span>
    </div>
    <div id="setupGrid"></div>
    <div id="setupFoot">
      <div id="setupLevels"></div>
      <button id="setupOnline" class="lvl" type="button" style="margin-left:auto">🌐 オンライン対戦</button>
      <button id="setupStart" type="button" disabled>対戦開始</button>
    </div>
  </div>

  <div id="boot">
    <h1><b>//</b> COMPILE</h1>
    <p>3D ARENA — LOADING</p>
    <div id="bootBar"><i></i></div>
  </div>

  <script src="engine.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/jsm/"
    }
  }
  </script>
  <link rel="stylesheet" href="js3d/playchoices.css">
  <div id="playChoices" hidden aria-label="選んだカードの配置先"></div>
  <script type="module" src="js3d/main.js"></script>
</body>
</html>
